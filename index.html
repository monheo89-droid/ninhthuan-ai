<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Thuận AI - Fixed Screenshot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --glass: rgba(255, 255, 255, 0.85); --success: #27ae60; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

        /* --- LỚP NỀN DỰ PHÒNG KHI CHỤP --- */
        #capture-placeholder {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: none; object-fit: cover;
        }

        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        #ui-canvas.moving { pointer-events: auto; } /* Cho phép kéo người */

        .top-btns { position: absolute; top: 20px; left: 20px; z-index: 10000; display: flex; gap: 12px; }
        .round-btn {
            width: 45px; height: 45px; background: var(--primary); color: white;
            border: none; border-radius: 50%; cursor: pointer; font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
        }

        .controls { 
            position: absolute; top: 75px; left: 20px; z-index: 9000; width: 280px; 
            background: var(--glass); padding: 20px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .controls.hidden { display: none; }

        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; cursor: pointer; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .btn-save { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; background: var(--success); }
        .btn-move { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid var(--primary); border-radius: 5px; cursor: pointer; background: white; }
        .btn-move.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG XỬ LÝ...</p></div>

<img id="capture-placeholder" src="https://monheo89-droid.github.io/ninhthuan-ai/images/bg-capture.jpg" crossorigin="anonymous">

<div class="top-btns">
    <button class="round-btn" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" style="background:var(--success)" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <h2 style="text-align: center; margin: 0 0 15px 0; font-size: 18px;">STUDIO AI</h2>
    <label for="input-file" class="label-btn">TẢI ẢNH NGƯỜI</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none; margin-top:15px;">
        <button id="move-toggle" class="btn-move" onclick="toggleMove()">CHẾ ĐỘ: DI CHUYỂN NGƯỜI</button>
        <p style="font-size: 12px; margin: 5px 0;">Kích thước:</p>
        <input type="range" id="size-slider" min="0.1" max="2.5" step="0.01" value="1.0" style="width:100%;" oninput="render()">
        <button class="btn-save" style="margin-top: 15px;" onclick="safeCapture()">LƯU ẢNH CHECK-IN</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null, imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false, offset = { x: 0, y: 0 }, moveEnabled = false;

    window.onload = () => { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    };

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('hidden'); }

    function toggleMove() {
        moveEnabled = !moveEnabled;
        const btn = document.getElementById('move-toggle');
        canvas.classList.toggle('moving', moveEnabled);
        btn.classList.toggle('active', moveEnabled);
        btn.innerText = moveEnabled ? "CHẾ ĐỘ: ĐANG DI CHUYỂN" : "CHẾ ĐỘ: XOAY CẢNH VR";
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { 
                method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData 
            });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = 450; imgPos.w = 450 * ratio; // Giữ thông số gốc của bạn
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { document.getElementById('loading').style.display = "none"; }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const s = document.getElementById('size-slider').value;
        if (userImg) ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // --- LOGIC DI CHUYỂN NGƯỜI ---
    canvas.onmousedown = (e) => {
        if(!moveEnabled) return;
        isDragging = true;
        offset.x = e.clientX - imgPos.x;
        offset.y = e.clientY - imgPos.y;
    };
    window.onmousemove = (e) => {
        if(isDragging && moveEnabled) {
            imgPos.x = e.clientX - offset.x;
            imgPos.y = e.clientY - offset.y;
            render();
        }
    };
    window.onmouseup = () => isDragging = false;

    // --- HÀM CHỤP ẢNH AN TOÀN (FIX NỀN ĐEN) ---
    function safeCapture() {
        const placeholder = document.getElementById('capture-placeholder');
        const uiMenu = document.getElementById('ai-menu');
        const topBtns = document.querySelector('.top-btns');

        // 1. Hiện ảnh nền mồi và ẩn UI
        placeholder.style.display = 'block';
        uiMenu.style.visibility = 'hidden';
        topBtns.style.visibility = 'hidden';

        setTimeout(() => {
            html2canvas(document.body, { useCORS: true }).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-checkin.png';
                a.href = c.toDataURL();
                a.click();

                // 2. Khôi phục lại trạng thái cũ
                placeholder.style.display = 'none';
                uiMenu.style.visibility = 'visible';
                topBtns.style.visibility = 'visible';
            });
        }, 100);
    }
</script>
</body>
</html>
