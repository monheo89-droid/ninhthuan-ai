<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI Studio - Final Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --glass: rgba(0, 0, 0, 0.7); --text: #fff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

        /* --- 1. LỚP VIDEO INTRO --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #btn-skip {
            position: absolute; bottom: 50px; padding: 10px 25px;
            background: rgba(255,255,255,0.2); border: 1px solid white; color: white;
            border-radius: 30px; cursor: pointer; z-index: 10000; backdrop-filter: blur(5px);
        }

        /* --- 2. LỚP NỀN (VR & ẢNH TĨNH) --- */
        .layer-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Iframe VR (Mặc định hiện) */
        #vr-frame { z-index: 1; border: none; }
        
        /* Ảnh nền tĩnh (Dùng khi chụp ảnh - Mặc định ẩn) */
        #static-bg { 
            z-index: 2; background-size: cover; background-position: center; 
            display: none; background-color: #222;
        }

        /* --- 3. LỚP CANVAS NGƯỜI (Ở GIỮA) --- */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; touch-action: none; 
            pointer-events: none; /* Mặc định KHÔNG chặn click để bấm được VR */
        }
        /* Class này kích hoạt khi đang chỉnh sửa người */
        .editing-mode { pointer-events: auto !important; cursor: move; border: 2px solid var(--primary); }

        /* --- 4. GIAO DIỆN ĐIỀU KHIỂN (TRÊN CÙNG) --- */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }

        .top-bar { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; gap: 10px; justify-content: space-between; box-sizing: border-box; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .btn-icon { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); color: white; font-size: 18px; cursor: pointer; backdrop-filter: blur(5px); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4); }

        /* Menu Công Cụ (Bên dưới) */
        .bottom-tools {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 20px 20px 0 0;
            display: none; flex-direction: column; gap: 10px;
            box-sizing: border-box; transition: transform 0.3s;
        }
        .bottom-tools.active { display: flex; pointer-events: auto; }

        .scroll-list { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 5px; }
        .bg-thumb { width: 80px; height: 60px; border-radius: 8px; object-fit: cover; border: 2px solid transparent; cursor: pointer; }
        .bg-thumb.selected { border-color: var(--primary); }

        /* Loading */
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        h4 { margin: 0 0 5px 0; color: #ccc; font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4"></video>
    <button id="btn-skip" onclick="closeIntro()">BẮT ĐẦU TRẢI NGHIỆM</button>
</div>

<div id="loading"><div class="loader"></div><p id="load-text">Đang xử lý...</p></div>

<iframe id="vr-frame" class="layer-bg" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
<div id="static-bg" class="layer-bg"></div>

<canvas id="ui-canvas"></canvas>

<div class="ui-layer">
    <div class="top-bar pointer-auto">
        <div>
            <button class="btn-icon" onclick="resetApp()">↺</button> </div>
        <button class="btn-primary" onclick="toggleStudio()">📸 STUDIO ẢNH</button>
    </div>

    <div id="studio-tools" class="bottom-tools">
        
        <div>
            <h4>1. Chọn Bối Cảnh (Để lưu ảnh)</h4>
            <div class="scroll-list">
                <img src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c/thumb.jpg" class="bg-thumb" onclick="changeBg(this.src)">
                <img src="https://live.staticflickr.com/65535/53443360677_5d47565984_k.jpg" class="bg-thumb" onclick="changeBg(this.src)">
                <img src="https://live.staticflickr.com/65535/53444583949_e2d6342674_k.jpg" class="bg-thumb" onclick="changeBg(this.src)">
                <img src="https://cdn.pixabay.com/photo/2016/11/14/03/29/temple-1822502_1280.jpg" class="bg-thumb" onclick="changeBg(this.src)">
            </div>
        </div>

        <div style="margin-top: 10px; display:flex; gap:10px; align-items:center;">
            <div style="flex:1;">
                <h4>2. Nhân Vật</h4>
                <label for="inp-file" class="btn-primary" style="font-size:12px; display:inline-block;">📂 Tải ảnh lên</label>
                <input type="file" id="inp-file" hidden accept="image/*" onchange="processAI(this)">
            </div>
            
            <div style="flex:1;">
                <h4>3. Kích Thước</h4>
                <input type="range" id="scale-range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="draw()" style="width:100%">
            </div>
        </div>

        <button class="btn-primary" style="width:100%; margin-top:15px; background: #2ecc71;" onclick="saveImage()">💾 LƯU BƯU THIẾP</button>
        <button class="btn-icon" style="position:absolute; top:10px; right:10px; width:30px; height:30px;" onclick="toggleStudio()">✕</button>
    </div>
</div>

<script>
    // --- CẤU HÌNH ---
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";
    
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const staticBg = document.getElementById('static-bg');
    const vrFrame = document.getElementById('vr-frame');
    
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // --- KHỞI TẠO ---
    window.onload = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };

    function closeIntro() {
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('v-intro').pause();
    }

    function resetApp() {
        location.reload();
    }

    // --- CHẾ ĐỘ STUDIO ---
    function toggleStudio() {
        const tools = document.getElementById('studio-tools');
        const isActive = tools.classList.contains('active');
        
        if (!isActive) {
            // Bật Studio: Hiện công cụ, Bật cảm ứng Canvas, Hiện nền tĩnh
            tools.classList.add('active');
            canvas.classList.add('editing-mode'); // CHO PHÉP CHẠM ĐỂ KÉO
            
            // Tạm ẩn VR để hiện nền tĩnh (fix lỗi chụp ảnh đen)
            vrFrame.style.display = 'none';
            staticBg.style.display = 'block';
            
            // Set nền mặc định nếu chưa có
            if(!staticBg.style.backgroundImage) {
                 changeBg('https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c/thumb.jpg');
            }
        } else {
            // Tắt Studio: Về lại VR
            tools.classList.remove('active');
            canvas.classList.remove('editing-mode'); // TẮT CẢM ỨNG ĐỂ BẤM ĐƯỢC NÚT VR
            
            vrFrame.style.display = 'block';
            staticBg.style.display = 'none';
        }
    }

    function changeBg(url) {
        // Cần dùng Proxy hoặc đảm bảo ảnh có CORS, ở đây dùng background-image CSS để hiển thị
        // Lưu ý: html2canvas có thể lỗi nếu ảnh từ domain chặn CORS. 
        // Tốt nhất nên dùng ảnh nội bộ hoặc ảnh từ host cho phép (như imgur, cloudinary).
        staticBg.style.backgroundImage = `url('${url}')`;
        
        // Hightlight thumbnail
        document.querySelectorAll('.bg-thumb').forEach(img => img.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    // --- XỬ LÝ AI ---
    async function processAI(input) {
        if (!input.files[0]) return;
        
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('load-text').innerText = "Đang tách nền...";

        const formData = new FormData();
        formData.append('file', input.files[0]);
