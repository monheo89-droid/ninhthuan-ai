<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/index.js"></script>

<script>
async function initAI(input) {
    if (!input.files[0]) return;
    const loadingDiv = document.getElementById('loading');
    loadingDiv.style.display = "flex";

    try {
        const imageSrc = input.files[0];
        // Cấu hình publicPath để GitHub không bị lỗi 404 file WASM
        const config = {
            publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/",
            debug: true,
            device: 'cpu' // Đảm bảo chạy ổn định trên mọi điện thoại
        };
        
        const blob = await imglyRemoveBackground(imageSrc, config);
        
        const img = new Image();
        img.onload = () => {
            userImg = img;
            const ratio = img.width / img.height;
            imgPos.h = 450; 
            imgPos.w = 450 * ratio;
            imgPos.x = (canvas.width - imgPos.w) / 2;
            imgPos.y = canvas.height - imgPos.h - 50;
            loadingDiv.style.display = "none";
            document.getElementById('edit-area').style.display = "block";
            render();
        };
        img.src = URL.createObjectURL(blob);
    } catch (e) {
        console.error(e);
        alert("Lỗi AI: GitHub Pages cần vài giây để tải dữ liệu lần đầu. Hãy thử lại sau 10 giây.");
        loadingDiv.style.display = "none";
    }
}
</script>
