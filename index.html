<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Stable Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --success: #27ae60; --glass: rgba(255, 255, 255, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }

        /* --- UI SIDEBAR --- */
        .ui-sidebar { position: absolute; top: 20px; left: 15px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .round-btn { width: 50px; height: 50px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* --- STUDIO AI --- */
        #ai-box { position: absolute; top: 80px; left: 15px; width: 260px; background: var(--glass); padding: 20px; border-radius: 20px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.4); transition: 0.3s; }
        #ai-box.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }

        /* --- CANVAS --- */
        #ui-canvas { position: absolute; inset: 0; z-index: 100; pointer-events: none; touch-action: none; }
        #ui-canvas.mode-move { pointer-events: auto; }

        /* Nền giả để chống đen khi chụp */
        #capture-bg { position: absolute; inset: 0; z-index: 5; display: none; object-fit: cover; width: 100%; height: 100%; }

        .pano-page { position: absolute; inset: 0; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .mode-toggle { width: 100%; padding: 10px; margin-top: 10px; border: 2px solid var(--primary); border-radius: 10px; background: white; font-weight: bold; cursor: pointer; }
        .mode-toggle.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div id="loading"><p>AI ĐANG XỬ LÝ...</p></div>

<img id="capture-bg" src="https://monheo89-droid.github.io/ninhthuan-ai/images/bg-capture.jpg" crossorigin="anonymous">

<div class="ui-sidebar">
    <button class="round-btn" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" style="background:var(--success)" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="ai-box" class="hidden">
    <div style="text-align:right; cursor:pointer; font-weight:bold; color:#999;" onclick="toggleAI()">✕</div>
    <h3 style="margin: 0 0 15px 0; text-align:center;">NINH THUẬN AI</h3>
    <label for="input-file" class="label-btn">TẢI ẢNH NGƯỜI</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <button id="btn-mode" class="mode-toggle" onclick="toggleMoveMode()">CHẾ ĐỘ: XOAY CẢNH</button>
        <p style="font-size:12px; margin: 15px 0 5px;">Kích thước:</p>
        <input type="range" id="size-slider" min="0.2" max="2.5" step="0.01" value="1.0" oninput="render()" style="width: 100%; margin-bottom: 20px;">
        <button onclick="stableCapture()" style="width:100%; padding:14px; background:var(--success); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">LƯU ẢNH (CHỐNG ĐEN NỀN)</button>
    </div>
</div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null, imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false, offset = { x: 0, y: 0 }, moveMode = false;

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        disableMoveMode();
    }

    function toggleAI() { document.getElementById('ai-box').classList.toggle('hidden'); }

    function toggleMoveMode() {
        moveMode = !moveMode;
        const btn = document.getElementById('btn-mode');
        if (moveMode) {
            btn.innerText = "CHẾ ĐỘ: DI CHUYỂN NGƯỜI";
            btn.classList.add('active');
            canvas.classList.add('mode-move');
        } else { disableMoveMode(); }
    }

    function disableMoveMode() {
        moveMode = false;
        const btn = document.getElementById('btn-mode');
        if(btn) { btn.innerText = "CHẾ ĐỘ: XOAY CẢNH"; btn.classList.remove('active'); }
        canvas.classList.remove('mode-move');
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = 450; imgPos.w = 450 * ratio; // Giữ thông số từ tab+ng.py
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { document.getElementById('loading').style.display = "none"; }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
        }
    }

    // --- DI CHUYỂN NHÂN VẬT ---
    function getPos(e) { return { x: e.touches ? e.touches[0].clientX : e.clientX, y: e.touches ? e.touches[0].clientY : e.clientY }; }
    function startDrag(e) {
        if (!userImg || !moveMode) return;
        const pos = getPos(e);
        const s = document.getElementById('size-slider').value;
        if (pos.x >= imgPos.x && pos.x <= imgPos.x + imgPos.w * s && pos.y >= imgPos.y && pos.y <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            offset.x = pos.x - imgPos.x; offset.y = pos.y - imgPos.y;
        }
    }
    function drag(e) { if (isDragging) { const pos = getPos(e); imgPos.x = pos.x - offset.x; imgPos.y = pos.y - offset.y; render(); } }
    canvas.addEventListener('touchstart', startDrag);
    window.addEventListener('touchmove', (e) => { if(isDragging) e.preventDefault(); drag(e); }, { passive: false });
    window.addEventListener('touchend', () => isDragging = false);

    // --- CHỤP ẢNH ỔN ĐỊNH ---
    function stableCapture() {
        const bg = document.getElementById('capture-bg');
        bg.style.display = 'block'; // Hiện ảnh nền thay thế Iframe
        document.querySelector('.ui-sidebar').style.visibility = 'hidden';
        document.getElementById('ai-box').style.visibility = 'hidden';

        setTimeout(() => {
            html2canvas(document.body, { 
                useCORS: true, 
                backgroundColor: null,
                scale: 2 // Tăng độ nét
            }).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-tour.png';
                a.href = c.toDataURL("image/png");
                a.click();
                
                bg.style.display = 'none';
                document.querySelector('.ui-sidebar').style.visibility = 'visible';
                document.getElementById('ai-box').style.visibility = 'visible';
            });
        }, 150);
    }
</script>
</body>
</html>
