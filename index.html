<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Thuận AI - Tách Nền Miễn Phí</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/index.js"></script>
    
    <style>
        :root { 
            --primary: #ff9800; 
            --glass: rgba(255, 255, 255, 0.85);
            --dark: #2c3e50;
            --success: #27ae60;
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #000; }

        /* --- 1. VIDEO INTRO LAYER --- */
        #intro-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; 
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }

        /* --- 2. HỆ THỐNG IFRAME TAB --- */
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        /* --- 3. ĐIỀU HƯỚNG --- */
        .top-btns { position: absolute; top: 20px; left: 20px; z-index: 10000; display: flex; gap: 12px; }
        .round-btn {
            width: 45px; height: 45px; background: var(--primary); color: white;
            border: none; border-radius: 50%; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
            transition: 0.3s; font-weight: bold;
        }
        .round-btn.cart { background: var(--success); }
        .round-btn.active { outline: 3px solid white; transform: scale(1.1); }

        /* Giao diện Menu Studio */
        .controls { 
            position: absolute; top: 75px; left: 20px; z-index: 9000; width: 280px; 
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 20px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: 0.4s; transform-origin: top left;
        }
        .controls.hidden { transform: scale(0); opacity: 0; pointer-events: none; }

        #loading { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.85); z-index: 20000; 
            display: none; flex-direction: column; align-items: center; justify-content: center; color: white; 
            text-align: center; padding: 20px;
        }
        .loader { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; cursor: pointer; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .btn-save { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: white; background: var(--success); margin-top: 10px; }
        
        #size-slider { width: 100%; margin: 10px 0; accent-color: var(--primary); }
        .slider-label { font-size: 12px; color: var(--dark); font-weight: bold; }
    </style>
</head>
<body>

<div id="loading">
    <div class="loader"></div>
    <p id="loading-text">AI ĐANG TÁCH NỀN...<br><small>(Lần đầu tiên có thể mất 15-20 giây để tải dữ liệu AI)</small></p>
</div>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
</div>

<div class="top-btns">
    <button class="round-btn active" id="btn-vr" onclick="switchTab('vr')">VR</button>
    <button class="round-btn cart" id="btn-shop" onclick="switchTab('shop')">SHOP</button>
    <button class="round-btn" onclick="toggleAI()">AI</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <h2 style="text-align: center; margin: 0 0 15px 0; font-size: 18px; color: var(--dark);">NINH THUẬN AI</h2>
    <label for="input-file" class="label-btn">📸 Tải ảnh người</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <span class="slider-label">Phóng to / Thu nhỏ:</span>
        <input type="range" id="size-slider" min="0.1" max="2.5" step="0.01" value="1.0" oninput="render()">
        <button class="btn-save" onclick="startCapture()">💾 Lưu bưu thiếp</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null, imgPos = { x: 0, y: 0, w: 0, h: 0 };

    window.onload = () => { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    };

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    }

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) {
            document.getElementById('v-intro').pause();
            intro.remove();
        }
    }

    function toggleAI() { 
        killIntro(); 
        document.getElementById('ai-menu').classList.toggle('hidden'); 
    }

    // --- XỬ LÝ AI TÁCH NỀN (OFFLINE - KHÔNG GIỚI HẠN) ---
    async function initAI(input) {
        if (!input.files[0]) return;
        
        const loadingDiv = document.getElementById('loading');
        loadingDiv.style.display = "flex";

        try {
            // Sử dụng thư viện imgly để tách nền trực tiếp trên trình duyệt
            const imageSrc = input.files[0];
            const blob = await imglyRemoveBackground(imageSrc);
            
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = 450; 
                imgPos.w = 450 * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                
                loadingDiv.style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) {
            console.error("Lỗi tách nền:", e);
            alert("Lỗi: Không thể tách nền. Vui lòng thử ảnh khác hoặc kiểm tra kết nối mạng lần đầu.");
            loadingDiv.style.display = "none";
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;

        const scale = document.getElementById('size-slider').value;
        const drawW = imgPos.w * scale;
        const drawH = imgPos.h * scale;
        
        // Vẽ ở giữa phía dưới màn hình
        const drawX = (canvas.width - drawW) / 2;
        const drawY = canvas.height - drawH - 20;

        ctx.drawImage(userImg, drawX, drawY, drawW, drawH);
    }

    function startCapture() {
        // Tạm ẩn menu AI trước khi chụp
        document.getElementById('ai-menu').classList.add('hidden');
        
        html2canvas(document.body, { useCORS: true }).then(c => {
            const a = document.createElement('a');
            a.download = 'ninh-thuan-ai-tour.png';
            a.href = c.toDataURL('image/png');
            a.click();
            
            // Hiện lại menu sau khi chụp xong
            document.getElementById('ai-menu').classList.remove('hidden');
        });
    }

    // Cập nhật lại kích thước canvas khi xoay màn hình
    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        render();
    };
</script>
</body>
</html>
