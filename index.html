<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI Tour - Capture Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE STYLE --- */
        :root { --primary: #FF6B00; --panel: rgba(20, 20, 20, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }

        /* 1. LAYOUT IFRAME (Z-INDEX SWAPPING) */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        .iframe-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
            z-index: 1; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .iframe-layer.active { z-index: 5; opacity: 1; pointer-events: auto; }

        /* Canvas: Nằm đè lên iframe để hiện nhân vật */
        #studio-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; touch-action: none; }

        /* 2. UI ELEMENTS */
        .ui-layer { transition: opacity 0.3s, transform 0.3s; }
        body.clean-mode .ui-layer { opacity: 0; pointer-events: none; transform: translateY(-20px); }

        /* Top Bar */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        .nav-switch { background: rgba(255,255,255,0.2); border-radius: 30px; padding: 4px; display: flex; }
        .nav-btn {
            background: transparent; border: none; color: #ccc; padding: 8px 16px; 
            border-radius: 25px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .nav-btn.active { background: #fff; color: #000; }

        /* Side Controls (Slider) */
        .side-controls {
            position: absolute; top: 80px; right: 15px; z-index: 90; display: none; /* Hiện khi có ảnh */
            flex-direction: column; align-items: center; gap: 15px;
        }
        .slider-box {
            height: 150px; width: 36px; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
        }
        input[type=range] {
            writing-mode: bt-lr; -webkit-appearance: slider-vertical;
            width: 8px; height: 120px; background: #ddd; outline: none;
        }

        /* Bottom Panel */
        .bottom-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--panel); border-radius: 20px 20px 0 0;
            padding: 15px 20px 25px; z-index: 200; 
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .tool-btn {
            background: transparent; border: none; color: white; display: flex; flex-direction: column; 
            align-items: center; gap: 6px; font-size: 11px; cursor: pointer; opacity: 0.8;
        }
        .tool-btn:hover { opacity: 1; }
        .tool-btn i { font-size: 22px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 12px; transition: 0.2s; }
        
        /* Nút chụp đặc biệt */
        .btn-capture { color: #FF6B00; font-weight: bold; }
        .btn-capture i { background: rgba(255, 107, 0, 0.2); border: 1px solid #FF6B00; box-shadow: 0 0 15px rgba(255,107,0,0.3); }
        .btn-capture:active i { transform: scale(0.9); }

        /* Loader & Flash */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 5000; display: none;
            align-items: center; justify-content: center; flex-direction: column; color: white;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 9999; opacity: 0; pointer-events: none;
        }

        /* Hướng dẫn chụp mobile */
        #mobile-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px;
            color: white; text-align: center; z-index: 4000; display: none; width: 80%;
        }

    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:10px;font-size:12px">ĐANG XỬ LÝ AI...</p></div>
<div id="flash"></div>

<div id="mobile-hint">
    <i class="fas fa-camera" style="font-size: 30px; margin-bottom: 10px; color: #FF6B00;"></i>
    <p style="margin: 0; font-size: 14px; line-height: 1.5;">Giao diện đã ẩn.<br>Hãy nhấn phím <b>Nguồn + Giảm âm lượng</b> để chụp màn hình ngay!</p>
</div>

<div class="top-bar ui-layer">
    <div class="nav-switch">
        <button class="nav-btn active" id="btn-vr" onclick="App.switchTab('vr')">VR Tour</button>
        <button class="nav-btn" id="btn-shop" onclick="App.switchTab('shop')">Gian Hàng</button>
    </div>
    <div style="font-size:12px; color:rgba(255,255,255,0.6)">Studio AI</div>
</div>

<div class="side-controls ui-layer" id="side-tools">
    <div class="slider-box">
        <input type="range" min="0.2" max="3.0" step="0.05" value="1.0" oninput="Studio.setScale(this.value)">
    </div>
</div>

<div class="viewport">
    <iframe id="frame-vr" class="iframe-layer active" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="iframe-layer" src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="studio-canvas"></canvas>

<div class="bottom-panel ui-layer">
    <button class="tool-btn" onclick="document.getElementById('inp-file').click()">
        <i class="fas fa-user-plus"></i> Thêm Người
    </button>
    
    <button class="tool-btn" onclick="Studio.flip()">
        <i class="fas fa-exchange-alt"></i> Lật Ảnh
    </button>

    <button class="tool-btn btn-capture" onclick="App.smartCapture()">
        <i class="fas fa-camera"></i> Chụp & Lưu
    </button>
    
    <input type="file" id="inp-file" hidden accept="image/*" onchange="Studio.handleAI(this)">
</div>

<script>
const CONFIG = { API_KEY: "FtyKLHXkG5By3gFBCBcoTACC" };

const App = {
    isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),

    switchTab: function(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        document.querySelectorAll('.iframe-layer').forEach(f => f.classList.remove('active'));
        document.getElementById('frame-' + tab).classList.add('active');
    },

    // --- CHỨC NĂNG CHỤP THÔNG MINH (SMART CAPTURE) ---
    smartCapture: async function() {
        // Hiệu ứng Flash
        const flash = document.getElementById('flash');
        flash.style.opacity = 0.8;
        setTimeout(() => flash.style.opacity = 0, 300);

        if (this.isMobile) {
            // --- LOGIC MOBILE: ẨN UI ĐỂ NGƯỜI DÙNG CHỤP ---
            const hint = document.getElementById('mobile-hint');
            hint.style.display = 'block';
            document.body.classList.add('clean-mode'); // Ẩn nút

            setTimeout(() => {
                document.body.classList.remove('clean-mode'); // Hiện lại sau 4s
                hint.style.display = 'none';
            }, 4000);
        } else {
            // --- LOGIC PC/LAPTOP: TỰ ĐỘNG CHỤP & GHÉP (Screen Capture API) ---
            try {
                // 1. Hỏi người dùng chia sẻ Tab hiện tại
                alert("HÃY CHỌN TAB NÀY (Tab hiện tại) để hệ thống tự chụp và ghép ảnh nền!");
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "never" }, 
                    audio: false
                });

                // 2. Lấy frame từ stream
                const track = stream.getVideoTracks()[0];
                const imageCapture = new ImageCapture(track);
                const bitmap = await imageCapture.grabFrame();
                
                // 3. Dừng stream ngay lập tức
                track.stop();

                // 4. Vẽ ảnh chụp màn hình nền (Iframe) lên Canvas tạm
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = bitmap.width;
                finalCanvas.height = bitmap.height;
                const ctx = finalCanvas.getContext('2d');
                
                // Vẽ nền vừa chụp được
                ctx.drawImage(bitmap, 0, 0);

                // 5. Vẽ nhân vật AI đè lên trên
                // Cần tính tỉ lệ vì ảnh chụp màn hình có thể khác kích thước canvas hiển thị
                if (Studio.img) {
                    const scaleX = finalCanvas.width / window.innerWidth;
                    const scaleY = finalCanvas.height / window.innerHeight;
                    
                    const p = Studio.state;
                    const w = Studio.img.width;
                    const h = Studio.img.height;
                    
                    ctx.save();
                    // Chuyển đổi tọa độ từ màn hình sang tọa độ ảnh chụp
                    ctx.translate(p.x * scaleX, p.y * scaleY);
                    ctx.scale((p.flipped ? -p.scale : p.scale) * scaleX, p.scale * scaleY); // Ước lượng scale
                    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 20;
                    ctx.drawImage(Studio.img, -w/2, -h/2);
                    ctx.restore();
                }

                // 6. Tải về
                const link = document.createElement('a');
                link.download = 'NinhThuan_Snapshot.png';
                link.href = finalCanvas.toDataURL();
                link.click();

            } catch (err) {
                console.error(err);
                alert("Bạn đã hủy chụp hoặc trình duyệt không hỗ trợ. Hãy thử lại!");
            }
        }
    }
};

const Studio = {
    canvas: document.getElementById('studio-canvas'),
    ctx: document.getElementById('studio-canvas').getContext('2d'),
    img: null,
    state: { x: 0, y: 0, scale: 1, flipped: false },

    init: function() {
        this.resize();
        window.addEventListener('resize', () => { this.resize(); this.draw(); });
        
        // Touch Drag
        this.canvas.addEventListener('touchstart', this.onStart.bind(this), {passive:false});
        this.canvas.addEventListener('touchmove', this.onMove.bind(this), {passive:false});
        this.canvas.addEventListener('touchend', () => this.dragging = false);
        
        // Mouse Drag (cho PC)
        this.canvas.addEventListener('mousedown', this.onStart.bind(this));
        window.addEventListener('mousemove', this.onMove.bind(this));
        window.addEventListener('mouseup', () => this.dragging = false);
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.draw();
    },

    handleAI: async function(input) {
        if(!input.files[0]) return;
        document.getElementById('loader').style.display = 'flex';
        
        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST", headers: { "X-Api-Key": CONFIG.API_KEY }, body: formData
            });
            if(!res.ok) throw new Error("API Fail");
            const blob = await res.blob();
            this.loadImg(blob);
        } catch (e) {
            alert("Lỗi AI hoặc hết lượt. Dùng ảnh gốc.");
            this.loadImg(input.files[0]);
        }
    },

    loadImg: function(src) {
        const img = new Image();
        img.onload = () => {
            this.img = img;
            // Auto fit
            const h = this.canvas.height * 0.5;
            this.state.scale = h / img.height;
            this.state.x = this.canvas.width / 2;
            this.state.y = this.canvas.height - h/2 - 50;
            
            document.querySelector("input[type=range]").value = this.state.scale;
            document.getElementById('side-tools').style.display = 'flex';
            document.getElementById('loader').style.display = 'none';
            this.canvas.style.pointerEvents = "auto";
            this.draw();
        };
        img.src = URL.createObjectURL(src instanceof Blob || src instanceof File ? src : new Blob([src]));
    },

    draw: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.img) {
            const { x, y, scale, flipped } = this.state;
            this.ctx.save();
            this.ctx.translate(x, y);
            this.ctx.scale(flipped ? -scale : scale, scale);
            this.ctx.shadowColor = "rgba(0,0,0,0.5)";
            this.ctx.shadowBlur = 15;
            this.ctx.drawImage(this.img, -this.img.width/2, -this.img.height/2);
            this.ctx.restore();
        }
    },

    setScale: function(val) {
        this.state.scale = parseFloat(val);
        this.draw();
    },

    flip: function() {
        this.state.flipped = !this.state.flipped;
        this.draw();
    },

    // Drag Logic
    dragging: false, startX: 0, startY: 0,
    onStart: function(e) {
        if(!this.img) return;
        this.dragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        this.startX = clientX - this.state.x;
        this.startY = clientY - this.state.y;
    },
    onMove: function(e) {
        if(!this.dragging) return;
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        this.state.x = clientX - this.startX;
        this.state.y = clientY - this.startY;
        this.draw();
    }
};

window.onload = () => Studio.init();
</script>
</body>
</html>
