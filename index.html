<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Mobile Optimized</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #ff9800; 
            --glass: rgba(255, 255, 255, 0.9);
            --dark: #2c3e50;
            --success: #27ae60;
        }
        
        /* Chống cuộn trang trên mobile */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #000; touch-action: none; 
        }

        /* --- 1. VIDEO INTRO --- */
        #intro-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; 
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }

        /* --- 2. HỆ THỐNG IFRAME --- */
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        /* --- 3. ĐIỀU HƯỚNG MOBILE (To hơn, dễ bấm) --- */
        .top-btns { 
            position: absolute; top: 15px; left: 15px; 
            z-index: 10000; display: flex; gap: 10px; 
        }
        .round-btn {
            width: 50px; height: 50px; background: var(--primary); color: white;
            border: none; border-radius: 50%; cursor: pointer; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;
            transition: 0.3s; -webkit-tap-highlight-color: transparent;
        }
        .round-btn.cart { background: var(--success); }
        .round-btn.active { border: 3px solid white; transform: scale(1.05); }

        /* Menu Studio AI - Tối ưu cho màn hình nhỏ */
        .controls { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            z-index: 9000; width: 90%; max-width: 320px; 
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .controls.hidden { transform: translateX(-50%) translateY(150%); opacity: 0; }

        /* Loading & Overlay */
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .label-btn { display: block; padding: 15px; background: var(--primary); color: white; border-radius: 12px; cursor: pointer; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .btn-save { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; color: white; background: var(--success); margin-top: 10px; }
        
        /* Slider to hơn cho mobile */
        input[type=range] { width: 100%; height: 30px; }
    </style>
</head>
<body>

<div id="loading"><div class="loader"></div><p>AI ĐANG TÁCH NỀN...</p></div>

<div id="intro-overlay" onclick="killIntro()">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <div style="position:absolute; bottom:20%; color:white; font-weight:bold; text-shadow:1px 1px 5px #000;">CHẠM ĐỂ BẮT ĐẦU</div>
</div>

<div class="top-btns">
    <button class="round-btn active" id="btn-vr" onclick="switchTab('vr')">VR</button>
    <button class="round-btn cart" id="btn-shop" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">👤</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <h3 style="text-align: center; margin: 0 0 10px 0;">STUDIO NINH THUẬN AI</h3>
    <label for="input-file" class="label-btn">Tải ảnh của bạn</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <p style="font-size: 12px; margin: 5px 0;">Kéo thả để di chuyển - Dùng thanh trượt để phóng to</p>
        <input type="range" id="size-slider" min="0.1" max="2.0" step="0.01" value="0.8" oninput="render()">
        <button class="btn-save" onclick="startCapture()">Lưu bưu thiếp</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null, imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;

    window.onload = () => { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    };

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    }

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) {
            document.getElementById('v-intro').pause();
            intro.style.opacity = '0';
            setTimeout(() => intro.remove(), 300);
        }
    }

    function toggleAI() { 
        killIntro(); 
        document.getElementById('ai-menu').classList.toggle('hidden'); 
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { 
                method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData 
            });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = window.innerHeight * 0.4; 
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 100;
                
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { 
            alert("Lỗi tách nền, vui lòng kiểm tra mạng!");
            document.getElementById('loading').style.display = "none"; 
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const scale = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * scale, imgPos.h * scale);
        }
    }

    // Xử lý di chuyển ảnh trên mobile (Touch Events)
    window.addEventListener('touchstart', (e) => { isDragging = true; });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
        if (isDragging && userImg) {
            const touch = e.touches[0];
            imgPos.x = touch.clientX - (imgPos.w / 2);
            imgPos.y = touch.clientY - (imgPos.h / 2);
            render();
        }
    });

    function startCapture() {
        document.getElementById('ai-menu').classList.add('hidden');
        setTimeout(() => {
            html2canvas(document.body).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-ai.png';
                a.href = c.toDataURL();
                a.click();
                document.getElementById('ai-menu').classList.remove('hidden');
            });
        }, 500);
    }
</script>
</body>
</html>
