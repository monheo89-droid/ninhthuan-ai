<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Professional Layout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE STYLE --- */
        :root { --primary: #FF6B00; --dock-bg: rgba(0, 0, 0, 0.6); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }

        /* 1. LAYOUT IFRAME */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        .iframe-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
            z-index: 1; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .iframe-layer.active { z-index: 5; opacity: 1; pointer-events: auto; }

        /* Canvas Nhân vật */
        #studio-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; touch-action: none; }

        /* 2. UI ELEMENTS (Sẽ ẩn khi chụp hình) */
        .ui-layer { transition: opacity 0.3s, transform 0.3s; }
        body.clean-mode .ui-layer { opacity: 0; pointer-events: none; }

        /* Top Bar */
        .top-bar {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            display: flex; gap: 10px;
        }
        .nav-btn {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); color: white; 
            padding: 8px 20px; border-radius: 30px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .nav-btn.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4); }

        /* --- NEW: RIGHT SIDE DOCK (THANH CÔNG CỤ BÊN PHẢI) --- */
        /* Đặt ở giữa bên phải để không che Panoee footer */
        .right-dock {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            z-index: 200; display: flex; flex-direction: column; gap: 15px;
            background: var(--dock-bg); backdrop-filter: blur(10px);
            padding: 15px 10px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
        }

        .tool-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 18px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.1); }
        .tool-btn.btn-main { background: var(--primary); box-shadow: 0 4px 10px rgba(255, 107, 0, 0.3); }

        /* Slider Dọc tích hợp trong Dock */
        .slider-wrapper {
            width: 45px; height: 120px; display: flex; justify-content: center; padding: 10px 0;
        }
        input[type=range] {
            writing-mode: bt-lr; -webkit-appearance: slider-vertical;
            width: 6px; height: 100%; background: rgba(255,255,255,0.3); outline: none; border-radius: 3px;
        }

        /* --- COUNTDOWN OVERLAY --- */
        #countdown-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: none; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .count-number { font-size: 150px; font-weight: 900; color: white; text-shadow: 0 0 30px rgba(0,0,0,0.5); animation: zoomPop 0.8s ease-out; }
        @keyframes zoomPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 5000; display: none;
            align-items: center; justify-content: center; flex-direction: column; color: white;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Hướng dẫn khi chụp */
        #hint-box {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; pointer-events: none; display: none; z-index: 4000;
        }

    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:15px; font-weight:bold">AI ĐANG TÁCH NỀN...</p></div>

<div id="intro-layer" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9000;display:flex;justify-content:center;align-items:center;">
    <video id="v-intro" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;">
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <button onclick="App.start()" style="position:absolute;bottom:50px;padding:12px 30px;border-radius:30px;border:1px solid white;background:rgba(0,0,0,0.5);color:white;cursor:pointer;font-weight:bold;">BẮT ĐẦU</button>
</div>

<div id="countdown-layer"><div class="count-number" id="count-text">3</div></div>
<div id="hint-box">Đang ẩn giao diện... Chụp ngay!</div>

<div class="top-bar ui-layer">
    <button class="nav-btn active" id="btn-vr" onclick="App.switchTab('vr')">VR Tour</button>
    <button class="nav-btn" id="btn-shop" onclick="App.switchTab('shop')">Gian Hàng</button>
</div>

<div class="right-dock ui-layer">
    <button class="tool-btn" onclick="document.getElementById('inp-file').click()" title="Thêm Người">
        <i class="fas fa-user-plus"></i>
    </button>
    <input type="file" id="inp-file" hidden accept="image/*" onchange="Studio.handleAI(this)">

    <div class="slider-wrapper">
        <input type="range" min="0.2" max="2.5" step="0.05" value="1.0" oninput="Studio.setScale(this.value)" title="Kéo để chỉnh to nhỏ">
    </div>

    <button class="tool-btn" onclick="Studio.flip()" title="Lật Trái/Phải">
        <i class="fas fa-exchange-alt"></i>
    </button>

    <button class="tool-btn btn-main" onclick="App.photoMode()" title="Chụp Ảnh">
        <i class="fas fa-camera"></i>
    </button>
</div>

<div class="viewport">
    <iframe id="frame-vr" class="iframe-layer active" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="iframe-layer" src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="studio-canvas"></canvas>

<script>
const CONFIG = { API_KEY: "FtyKLHXkG5By3gFBCBcoTACC" };

const App = {
    init: function() {
        Studio.init();
    },

    start: function() {
        document.getElementById('intro-layer').remove();
    },

    switchTab: function(tab) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        document.querySelectorAll('.iframe-layer').forEach(f => f.classList.remove('active'));
        document.getElementById('frame-' + tab).classList.add('active');
    },

    // --- CHẾ ĐỘ CHỤP ẢNH "CLEAN MODE" ---
    photoMode: function() {
        // 1. Hiển thị đếm ngược
        const layer = document.getElementById('countdown-layer');
        const text = document.getElementById('count-text');
        layer.style.display = 'flex';
        
        let count = 3;
        text.innerText = count;

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                text.innerText = count;
                // Reset animation
                text.style.animation = 'none';
                text.offsetHeight; 
                text.style.animation = 'zoomPop 0.8s ease-out';
            } else {
                // 2. KẾT THÚC ĐẾM -> ẨN UI
                clearInterval(timer);
                layer.style.display = 'none';
                this.hideUI();
            }
        }, 1000);
    },

    hideUI: function() {
        // Thêm class để ẩn toàn bộ nút
        document.body.classList.add('clean-mode');
        document.getElementById('hint-box').style.display = 'block';

        // Tự động hiện lại sau 6 giây
        setTimeout(() => {
            document.body.classList.remove('clean-mode');
            document.getElementById('hint-box').style.display = 'none';
        }, 6000); // 6 giây để người dùng chụp thoải mái
    }
};

const Studio = {
    canvas: document.getElementById('studio-canvas'),
    ctx: document.getElementById('studio-canvas').getContext('2d'),
    img: null,
    state: { x: 0, y: 0, scale: 1, flipped: false },

    init: function() {
        this.resize();
        window.addEventListener('resize', () => { this.resize(); this.draw(); });
        
        // Mouse/Touch Events
        this.canvas.addEventListener('mousedown', this.startDrag.bind(this));
        this.canvas.addEventListener('touchstart', this.startDrag.bind(this), {passive: false});
        window.addEventListener('mousemove', this.drag.bind(this));
        window.addEventListener('touchmove', this.drag.bind(this), {passive: false});
        window.addEventListener('mouseup', () => this.dragging = false);
        window.addEventListener('touchend', () => this.dragging = false);
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.draw(); // Vẽ lại khi resize
    },

    handleAI: async function(input) {
        if(!input.files[0]) return;
        document.getElementById('loader').style.display = 'flex';
        
        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST", headers: { "X-Api-Key": CONFIG.API_KEY }, body: formData
            });
            if(!res.ok) throw new Error("Lỗi API");
            const blob = await res.blob();
            this.loadImg(blob);
        } catch (e) {
            alert("Đã dùng hết lượt AI miễn phí hoặc lỗi mạng. Chuyển sang ảnh gốc.");
            this.loadImg(input.files[0]);
        }
    },

    loadImg: function(src) {
        const img = new Image();
        img.onload = () => {
            this.img = img;
            // Đặt vị trí mặc định
            const h = this.canvas.height * 0.6; // Cao 60% màn hình
            this.state.scale = h / img.height;
            this.state.x = this.canvas.width / 2;
            this.state.y = this.canvas.height - h/2 - 20;
            
            // Sync Slider
            document.querySelector("input[type=range]").value = this.state.scale;
            
            document.getElementById('loader').style.display = 'none';
            this.canvas.style.pointerEvents = "auto";
            this.draw();
        };
        img.src = URL.createObjectURL(src instanceof Blob || src instanceof File ? src : new Blob([src]));
    },

    draw: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.img) {
            const { x, y, scale, flipped } = this.state;
            const w = this.img.width;
            const h = this.img.height;

            this.ctx.save();
            this.ctx.translate(x, y);
            this.ctx.scale(flipped ? -scale : scale, scale);
            // Đổ bóng nhẹ cho thật
            this.ctx.shadowColor = "rgba(0,0,0,0.5)";
            this.ctx.shadowBlur = 20;
            this.ctx.shadowOffsetY = 10;
            this.ctx.drawImage(this.img, -w/2, -h/2);
            this.ctx.restore();
        }
    },

    setScale: function(val) {
        this.state.scale = parseFloat(val);
        this.draw();
    },

    flip: function() {
        this.state.flipped = !this.state.flipped;
        this.draw();
    },

    // Drag Logic
    dragging: false, startX: 0, startY: 0,
    startDrag: function(e) {
        if(!this.img) return;
        this.dragging = true;
        const p = e.touches ? e.touches[0] : e;
        this.startX = p.clientX - this.state.x;
        this.startY = p.clientY - this.state.y;
    },
    drag: function(e) {
        if(!this.dragging) return;
        e.preventDefault(); // Chặn cuộn trang trên mobile
        const p = e.touches ? e.touches[0] : e;
        this.state.x = p.clientX - this.startX;
        this.state.y = p.clientY - this.startY;
        this.draw();
    }
};

window.onload = () => App.init();
</script>
</body>
</html>
