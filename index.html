<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Thuận AI - Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        /* Hình nền toàn cảnh Ninh Thuận như trong ảnh của bạn */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://monheo89-droid.github.io/ninhthuan-ai/assets/bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        /* Giao diện nút bấm bên trái */
        .sidebar {
            position: absolute;
            top: 20%;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 200px;
        }

        .sidebar h2 { color: #ffcc00; margin: 0 0 15px 0; font-size: 20px; }

        .btn-upload {
            background: #8b5a2b; /* Màu nâu như trong ảnh */
            color: #ffcc00;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn-upload:hover { background: #a67c52; }

        /* Vùng hiển thị nhân vật sau khi tách nền */
        #person-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 400px;
            z-index: 10;
        }

        #person-img { width: 100%; display: none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

        /* Overlay thông báo đang xử lý (Fix lỗi treo cứng) */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="sidebar">
        <h2>STUDIO AI</h2>
        <button class="btn-upload" onclick="document.getElementById('file-input').click()">
            TẢI ẢNH NGƯỜI
        </button>
        <input type="file" id="file-input" style="display: none;" accept="image/*">
    </div>

    <div id="person-container">
        <img id="person-img" src="" alt="Nhân vật">
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">ĐANG TÁCH NỀN...</p>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const personImg = document.getElementById('person-img');
        const loader = document.getElementById('loading-overlay');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 1. Hiện thông báo đang xử lý
            loader.style.display = 'flex';

            try {
                // 2. Xử lý xóa nền offline bằng thư viện @imgly
                // Không gọi API bên ngoài, không lo hết lượt (lỗi 402)
                const blob = await imglyRemoveBackground(file);
                
                // 3. Hiển thị ảnh kết quả
                const url = URL.createObjectURL(blob);
                personImg.src = url;
                personImg.style.display = 'block';

            } catch (error) {
                console.error("Lỗi xử lý:", error);
                alert("Không thể tách nền ảnh này. Vui lòng thử ảnh khác!");
            } finally {
                // 4. Luôn ẩn loading khi xong hoặc lỗi để tránh treo web
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
