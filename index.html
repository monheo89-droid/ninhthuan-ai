<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninh Thuận AI - No Lag</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --success: #27ae60; --glass: rgba(255, 255, 255, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }

        /* --- INTRO --- */
        #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }
        .start-btn { position: absolute; bottom: 15%; background: var(--primary); color: #fff; padding: 15px 30px; border-radius: 40px; border: 2px solid #fff; font-weight: bold; cursor: pointer; }

        /* --- UI LAYER --- */
        .ui-sidebar { position: absolute; top: 20px; left: 15px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
        .round-btn { width: 50px; height: 50px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* STUDIO BOX - Chống treo */
        #ai-box { 
            position: absolute; top: 80px; left: 15px; width: 260px; 
            background: var(--glass); padding: 15px; border-radius: 20px; 
            z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.3s; pointer-events: auto;
        }
        #ai-box.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }

        /* CANVAS LAYER - Chỉ nhận chạm khi có ảnh */
        #ui-canvas { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
        #ui-canvas.active { pointer-events: auto; }

        .pano-page { position: absolute; inset: 0; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG XỬ LÝ...</p></div>

<div id="intro-overlay" onclick="killIntro()">
    <video id="v-intro" autoplay muted loop playsinline><source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4"></video>
    <div class="start-btn">MỜI BẠN BẮT ĐẦU THAM QUAN</div>
</div>

<div class="ui-sidebar">
    <button class="round-btn" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" style="background:#27ae60" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="ai-box" class="hidden">
    <div style="text-align:right; font-weight:bold; color:#999;" onclick="toggleAI()">✕</div>
    <h3 style="margin: 0 0 15px 0; text-align:center;">STUDIO AI</h3>
    <label for="input-file" class="label-btn">TẢI ẢNH</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <p style="font-size:12px; color:#666;">Kéo ảnh để di chuyển | Trượt để phóng to:</p>
        <input type="range" id="size-slider" min="0.2" max="2.5" step="0.01" value="1.0" oninput="render()" style="width: 100%; margin-bottom: 15px;">
        <button onclick="startCapture()" style="width:100%; padding:12px; background:var(--success); color:white; border:none; border-radius:10px; font-weight:bold;">LƯU ẢNH</button>
    </div>
</div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;
    let imgPos = { x: 50, y: 200, w: 0, h: 0 };
    let isDragging = false;
    let offset = { x: 0, y: 0 };

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; render(); }
    window.onresize = resize; resize();

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) { intro.style.opacity = '0'; setTimeout(() => intro.remove(), 500); }
    }

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('ai-box').classList.add('hidden');
    }

    function toggleAI() {
        killIntro();
        document.getElementById('ai-box').classList.toggle('hidden');
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = 350; imgPos.w = 350 * ratio;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                canvas.classList.add('active'); // Kích hoạt chạm trên canvas
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { document.getElementById('loading').style.display = "none"; }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
        }
    }

    // --- DI CHUYỂN NHÂN VẬT ---
    function getPos(e) { return { x: e.touches ? e.touches[0].clientX : e.clientX, y: e.touches ? e.touches[0].clientY : e.clientY }; }
    
    function startDrag(e) {
        if (!userImg) return;
        const pos = getPos(e);
        const s = document.getElementById('size-slider').value;
        if (pos.x >= imgPos.x && pos.x <= imgPos.x + imgPos.w * s && pos.y >= imgPos.y && pos.y <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            offset.x = pos.x - imgPos.x;
            offset.y = pos.y - imgPos.y;
        }
    }
    function drag(e) { if (isDragging) { const pos = getPos(e); imgPos.x = pos.x - offset.x; imgPos.y = pos.y - offset.y; render(); } }
    function stopDrag() { isDragging = false; }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('touchstart', startDrag);
    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, { passive: false });
    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('touchend', stopDrag);

    function startCapture() {
        document.querySelector('.ui-sidebar').style.display = 'none';
        document.getElementById('ai-box').style.display = 'none';
        setTimeout(() => {
            html2canvas(document.body).then(c => {
                const a = document.createElement('a');
                a.download = 'checkin.png'; a.href = c.toDataURL(); a.click();
                document.querySelector('.ui-sidebar').style.display = 'flex';
                document.getElementById('ai-box').style.display = 'block';
            });
        }, 500);
    }
</script>
</body>
</html>
