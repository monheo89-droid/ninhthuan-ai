<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio AI - Xóa Nền Tự Động</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #2d2d2d; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 600px; width: 90%; }
        h1 { color: #ffcc00; margin-bottom: 20px; }
        .upload-box { border: 2px dashed #555; padding: 30px; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 20px; position: relative; }
        .upload-box:hover { border-color: #ffcc00; background: #363636; }
        #image-input { display: none; }
        .btn { background: #ffcc00; color: #000; padding: 12px 25px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 10px; }
        .btn:hover { background: #e6b800; }
        .preview-container { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        img { max-width: 100%; border-radius: 8px; border: 1px solid #444; max-height: 250px; }
        /* Hiệu ứng xoay khi đang xử lý */
        .loading { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 10px; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ffcc00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>STUDIO AI</h1>
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('image-input').click()">
        <p id="status-text">Kéo thả hoặc Click để TẢI ẢNH NGƯỜI</p>
        <input type="file" id="image-input" accept="image/*">
        
        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p>AI ĐANG TÁCH NỀN...</p>
        </div>
    </div>

    <div class="preview-container">
        <div id="result-area" style="display: none;">
            <h3>Kết quả:</h3>
            <img id="output-image" src="" alt="Kết quả">
            <br>
            <button class="btn" id="download-btn">TẢI XUỐNG ẢNH</button>
        </div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('image-input');
    const outputImage = document.getElementById('output-image');
    const resultArea = document.getElementById('result-area');
    const loader = document.getElementById('loader');
    const downloadBtn = document.getElementById('download-btn');
    const statusText = document.getElementById('status-text');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 1. Hiển thị trạng thái đang xử lý
        loader.style.display = 'flex';
        statusText.innerText = "Đang xử lý file: " + file.name;

        try {
            // 2. Gọi thư viện tách nền (Xử lý Offline ngay tại trình duyệt)
            // Không tốn phí, không giới hạn lượt dùng
            const blob = await imglyRemoveBackground(file);

            // 3. Hiển thị kết quả
            const url = URL.createObjectURL(blob);
            outputImage.src = url;
            resultArea.style.display = 'block';

            // 4. Cấu hình nút tải xuống
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = url;
                link.download = 'ai-remove-bg.png';
                link.click();
            };

        } catch (error) {
            console.error("Lỗi:", error);
            alert("Có lỗi xảy ra khi AI tách nền. Hãy thử ảnh khác!");
        } finally {
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
