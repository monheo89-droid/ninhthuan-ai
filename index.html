<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --glass: rgba(255, 255, 255, 0.9); --success: #27ae60; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; touch-action: none; }

        /* Lớp phủ Video Intro */
        #intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }

        /* Iframe Tour - Dùng clip-path để ẩn phần dưới cùng (nơi chứa chatbot Thổ địa) */
        .pano-page { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            visibility: hidden; z-index: 1;
            /* Cắt bớt 50px dưới cùng của iframe để che nút chatbot */
            clip-path: inset(0 0 50px 0); 
        }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: calc(100% + 50px); border: none; }

        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        /* Điều hướng Mobile */
        .top-btns { position: absolute; top: 15px; left: 15px; z-index: 10000; display: flex; gap: 10px; }
        .round-btn {
            width: 50px; height: 50px; background: var(--primary); color: white;
            border: none; border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .round-btn.active { border: 3px solid white; }

        /* Menu Studio AI */
        .controls { 
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); 
            z-index: 9000; width: 85%; max-width: 320px; 
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 15px; border-radius: 20px; text-align: center;
            transition: 0.4s;
        }
        .controls.hidden { transform: translateX(-50%) translateY(150%); opacity: 0; }
        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; font-weight: bold; margin-bottom: 10px; }
        .btn-save { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--success); color: white; font-weight: bold; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG XỬ LÝ...</p></div>

<div id="intro-overlay" onclick="killIntro()">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
</div>

<div class="top-btns">
    <button class="round-btn active" id="btn-vr" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" id="btn-shop" onclick="switchTab('shop')" style="background:#27ae60">🛒</button>
    <button class="round-btn" onclick="toggleAI()">👤</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <label for="input-file" class="label-btn">CHỤP ẢNH / TẢI LÊN</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    <div id="edit-area" style="display: none;">
        <input type="range" id="size-slider" min="0.5" max="2" step="0.01" value="1" oninput="render()" style="width:100%">
        <button class="btn-save" onclick="startCapture()">LƯU BƯU THIẾP</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null, imgPos = { x: 50, y: 100, w: 0, h: 0 };

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
    }

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) { document.getElementById('v-intro').pause(); intro.remove(); }
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('hidden'); }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        const res = await fetch("https://api.remove.bg/v1.0/removebg", { 
            method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData 
        });
        const blob = await res.blob();
        const img = new Image();
        img.onload = () => {
            userImg = img;
            imgPos.w = 250; imgPos.h = 250 * (img.height/img.width);
            document.getElementById('loading').style.display = "none";
            document.getElementById('edit-area').style.display = "block";
            render();
        };
        img.src = URL.createObjectURL(blob);
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
        }
    }

    function startCapture() {
        document.getElementById('ai-menu').style.display = 'none';
        html2canvas(document.body).then(c => {
            const a = document.createElement('a');
            a.download = 'ninh-thuan.png';
            a.href = c.toDataURL();
            a.click();
            document.getElementById('ai-menu').style.display = 'block';
        });
    }

    // Touch di chuyển ảnh
    window.addEventListener('touchmove', (e) => {
        if (userImg) {
            imgPos.x = e.touches[0].clientX - (imgPos.w/2);
            imgPos.y = e.touches[0].clientY - (imgPos.h/2);
            render();
        }
    });
</script>
</body>
</html>
