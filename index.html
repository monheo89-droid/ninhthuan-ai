<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Fix Di Chuyển & Chụp Ảnh</title>
    <style>
        :root { --primary: #ff9800; --success: #27ae60; --glass: rgba(255, 255, 255, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* Lớp VR */
        .pano-page { position: absolute; inset: 0; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 5; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Canvas Nhân vật - Quan trọng để sửa lỗi đơ di chuyển */
        #ui-canvas { 
            position: absolute; inset: 0; 
            z-index: 10; /* Mặc định dưới các nút bấm nhưng trên iframe */
            pointer-events: none; /* Cho phép xuyên qua để xoay VR */
            touch-action: none;
        }
        #ui-canvas.mode-active { 
            pointer-events: auto; /* Kích hoạt để di chuyển người */
            z-index: 99999; 
        }

        /* Giao diện nút bấm */
        .ui-sidebar { position: absolute; top: 20px; left: 15px; z-index: 100000; display: flex; flex-direction: column; gap: 12px; }
        .round-btn { width: 50px; height: 50px; background: var(--primary); color: white; border: 2px solid #fff; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #ai-menu { 
            position: absolute; top: 80px; left: 15px; width: 260px; 
            background: var(--glass); padding: 20px; border-radius: 20px; 
            z-index: 100000; box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            transition: 0.3s; 
        }
        #ai-menu.hidden { display: none; }

        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .mode-toggle { width: 100%; padding: 12px; margin-top: 10px; border: 2px solid var(--primary); border-radius: 10px; background: white; font-weight: bold; cursor: pointer; }
        .mode-toggle.active { background: var(--success); color: white; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200000; display: none; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG LƯU ẢNH...</p></div>

<div class="ui-sidebar">
    <button class="round-btn" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" style="background:var(--success)" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="ai-menu" class="hidden">
    <h3 style="text-align:center; margin-top:0;">STUDIO AI</h3>
    <label for="input-file" class="label-btn">TẢI ẢNH NGƯỜI</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <button id="btn-mode" class="mode-toggle" onclick="toggleMoveMode()">CHẾ ĐỘ: XOAY CẢNH</button>
        <p style="font-size:12px; margin: 15px 0 5px;">Kích thước:</p>
        <input type="range" id="size-slider" min="0.2" max="2.5" step="0.01" value="1.0" oninput="render()" style="width:100%;">
        <button onclick="fastCapture()" style="width:100%; padding:14px; background:var(--success); color:white; border:none; border-radius:10px; font-weight:bold; margin-top:15px;">LƯU ẢNH (KHÔNG TREO)</button>
    </div>
</div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    
    // Ảnh nền cố định để tránh nền đen từ Iframe
    const BG_URL = "https://monheo89-droid.github.io/ninhthuan-ai/images/bg-capture.jpg";
    let userImg = null, imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false, offset = { x: 0, y: 0 }, moveMode = false;

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        disableMoveMode();
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('hidden'); }

    function toggleMoveMode() {
        moveMode = !moveMode;
        const btn = document.getElementById('btn-mode');
        if (moveMode) {
            btn.innerText = "CHẾ ĐỘ: DI CHUYỂN NGƯỜI";
            btn.classList.add('active');
            canvas.classList.add('mode-active');
        } else { disableMoveMode(); }
    }

    function disableMoveMode() {
        moveMode = false;
        const btn = document.getElementById('btn-mode');
        if(btn) { btn.innerText = "CHẾ ĐỘ: XOAY CẢNH"; btn.classList.remove('active'); }
        canvas.classList.remove('mode-active');
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = 450; imgPos.w = 450 * ratio; // Thông số từ tab+ng.py
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { document.getElementById('loading').style.display = "none"; }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
        }
    }

    // Xử lý di chuyển mượt mà trên Mobile
    function getPos(e) { return { x: e.touches ? e.touches[0].clientX : e.clientX, y: e.touches ? e.touches[0].clientY : e.clientY }; }
    
    canvas.addEventListener('touchstart', (e) => {
        if (!userImg || !moveMode) return;
        const pos = getPos(e);
        const s = document.getElementById('size-slider').value;
        if (pos.x >= imgPos.x && pos.x <= imgPos.x + imgPos.w * s && pos.y >= imgPos.y && pos.y <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            offset.x = pos.x - imgPos.x; offset.y = pos.y - imgPos.y;
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (isDragging) {
            e.preventDefault();
            const pos = getPos(e);
            imgPos.x = pos.x - offset.x;
            imgPos.y = pos.y - offset.y;
            render();
        }
    }, { passive: false });

    window.addEventListener('touchend', () => isDragging = false);

    // HÀM CHỤP ẢNH TỐC ĐỘ CAO - KHÔNG TREO MÁY
    function fastCapture() {
        document.getElementById('loading').style.display = "flex";
        const snapshot = document.createElement('canvas');
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        const sctx = snapshot.getContext('2d');

        const bg = new Image();
        bg.crossOrigin = "anonymous";
        bg.onload = () => {
            sctx.drawImage(bg, 0, 0, snapshot.width, snapshot.height);
            sctx.drawImage(canvas, 0, 0);
            
            const link = document.createElement('a');
            link.download = 'ninh-thuan-ai.png';
            link.href = snapshot.toDataURL("image/png");
            link.click();
            document.getElementById('loading').style.display = "none";
        };
        bg.src = BG_URL;
    }
</script>
</body>
</html>
