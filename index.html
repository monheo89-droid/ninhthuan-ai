<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Thuận AI - GitHub Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/index.js"></script>
    
    <style>
        :root { --primary: #ff9800; --glass: rgba(255, 255, 255, 0.85); --success: #27ae60; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }
        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        .top-btns { position: absolute; top: 20px; left: 20px; z-index: 10000; display: flex; gap: 12px; }
        .round-btn { width: 45px; height: 45px; background: var(--primary); color: white; border: none; border-radius: 50%; cursor: pointer; font-weight: bold; }
        .round-btn.active { outline: 3px solid white; }
        .controls { position: absolute; top: 75px; left: 20px; z-index: 9000; width: 280px; background: var(--glass); padding: 20px; border-radius: 20px; backdrop-filter: blur(10px); }
        .hidden { display: none; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .label-btn { display: block; padding: 12px; background: var(--primary); color: white; border-radius: 10px; cursor: pointer; text-align: center; margin-bottom: 10px; font-weight: bold; }
        .btn-save { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--success); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="loading">
    <div class="loader"></div>
    <p>AI ĐANG KHỞI TẠO...<br><small>Vui lòng đợi trong giây lát</small></p>
</div>

<div class="top-btns">
    <button class="round-btn active" onclick="switchTab('vr')">VR</button>
    <button class="round-btn" onclick="switchTab('shop')">SHOP</button>
    <button class="round-btn" onclick="toggleAI()">AI</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <h3 style="margin-top:0">NINH THUẬN AI</h3>
    <label for="input-file" class="label-btn">📸 Tải ảnh người</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    <div id="edit-area" style="display: none;">
        <p style="font-size:12px">Kéo để chỉnh kích thước:</p>
        <input type="range" id="size-slider" min="0.1" max="2.0" step="0.01" value="1.0" style="width:100%" oninput="render()">
        <button class="btn-save" onclick="startCapture()">💾 Lưu ảnh</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };

    window.onload = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('hidden'); }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";

        try {
            // Fix quan trọng cho GitHub Pages: Chỉ định rõ publicPath từ CDN
            const config = {
                publicPath: "https://cdn.jsdelivr.net/npm/@imgly/background-removal@latest/dist/",
            };
            
            const blob = await imglyRemoveBackground(input.files[0], config);
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5;
                imgPos.w = imgPos.h * ratio;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) {
            console.error(e);
            alert("Lỗi AI: Vui lòng thử lại hoặc sử dụng trình duyệt Chrome/Safari mới nhất.");
            document.getElementById('loading').style.display = "none";
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        const w = imgPos.w * s;
        const h = imgPos.h * s;
        ctx.drawImage(userImg, (canvas.width - w)/2, canvas.height - h - 20, w, h);
    }

    function startCapture() {
        document.getElementById('ai-menu').classList.add('hidden');
        setTimeout(() => {
            html2canvas(document.body, { useCORS: true, allowTaint: true }).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-ai.png';
                a.href = c.toDataURL();
                a.click();
                document.getElementById('ai-menu').classList.remove('hidden');
            });
        }, 500);
    }
</script>
</body>
</html>
