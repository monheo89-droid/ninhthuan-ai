<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninh Thuận AI - Mobile Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #ff9800; 
            --glass: rgba(255, 255, 255, 0.98);
            --dark: #2c3e50;
            --success: #27ae60;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #000;
        }

        /* --- 1. VIDEO INTRO LAYER --- */
        #intro-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; 
            transition: opacity 0.5s ease;
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Nút bắt đầu tham quan (Thay thế hoàn toàn nút Bỏ qua) */
        .start-btn {
            position: absolute; bottom: 20%; 
            background: var(--primary); color: #fff; padding: 15px 30px; 
            border-radius: 40px; border: 2px solid #fff; font-weight: bold;
            font-size: 16px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            animation: pulse 2s infinite; cursor: pointer;
            z-index: 100000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- 2. HỆ THỐNG IFRAME --- */
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- 3. ĐIỀU HƯỚNG TỐI ƯU MOBILE (Tránh bị che khuất) --- */
        .top-btns { 
            position: absolute; top: 25px; left: 20px;
            z-index: 9999; display: flex; flex-direction: column; gap: 12px; 
        }
        .round-btn {
            width: 48px; height: 48px; background: var(--primary); color: white;
            border: none; border-radius: 50%; cursor: pointer; font-size: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff; -webkit-tap-highlight-color: transparent;
        }
        .round-btn.active { background: #fff; color: var(--primary); transform: scale(1.1); }
        .round-btn.cart { background: var(--success); }

        /* --- 4. STUDIO AI --- */
        .controls { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; z-index: 10000; background: var(--glass); 
            padding: 25px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .controls.hidden { transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
        .close-ai { position: absolute; top: 10px; right: 15px; font-size: 22px; color: #999; font-weight: bold; cursor: pointer; }

        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        .label-btn { display: block; padding: 15px; background: var(--primary); color: white; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-save { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; color: white; background: var(--success); cursor: pointer; }

        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG XỬ LÝ...</p></div>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <div class="start-btn" onclick="killIntro()">Mời bạn bắt đầu tham quan</div>
</div>

<div class="top-btns">
    <button class="round-btn active" id="btn-vr" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn cart" id="btn-shop" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="page-vr" class="pano-page active">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>
</div>
<div id="page-shop" class="pano-page">
    <iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe>
</div>

<div class="controls hidden" id="ai-menu">
    <div class="close-ai" onclick="toggleAI()">✕</div>
    <h3 style="text-align: center; margin-top: 0; color: var(--dark);">STUDIO AI</h3>
    
    <label for="input-file" class="label-btn">TẢI ẢNH</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-area" style="display: none;">
        <p style="font-size: 14px; margin: 10px 0 5px 0; color: #666;">Chỉnh kích thước người:</p>
        <input type="range" id="size-slider" min="0.3" max="2.5" step="0.01" value="1.0" oninput="render()" style="width: 100%; margin-bottom: 15px;">
        <button class="btn-save" onclick="startCapture()">LƯU ẢNH CHECK-IN</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        render();
    }
    window.onresize = resize;
    resize();

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
        document.getElementById('ai-menu').classList.add('hidden');
    }

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) { 
            document.getElementById('v-intro').pause();
            intro.style.opacity = '0'; 
            setTimeout(() => intro.remove(), 500);
        }
    }

    function toggleAI() { 
        killIntro();
        document.getElementById('ai-menu').classList.toggle('hidden');
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { 
                method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData 
            });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-area').style.display = "block";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { 
            document.getElementById('loading').style.display = "none";
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            const w = (canvas.width * 0.5) * s;
            const h = (w * (userImg.height / userImg.width));
            ctx.drawImage(userImg, (canvas.width - w)/2, canvas.height - h - 50, w, h);
        }
    }

    function startCapture() {
        document.querySelector('.top-btns').style.display = 'none';
        document.getElementById('ai-menu').style.display = 'none';
        setTimeout(() => {
            html2canvas(document.body, { useCORS: true }).then(c => {
                const a = document.createElement('a');
                a.download = 'checkin-ninh-thuan.png';
                a.href = c.toDataURL();
                a.click();
                document.querySelector('.top-btns').style.display = 'flex';
                document.getElementById('ai-menu').style.display = 'block';
            });
        }, 500);
    }
</script>
</body>
</html>
