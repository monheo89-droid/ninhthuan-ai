<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI Studio</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ff9800">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1042/1042339.png">

    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.0.4/dist/imgly-background-removal.min.js"></script>

    <style>
        /* --- CẤU HÌNH GIAO DIỆN CHUNG --- */
        :root { --primary: #ff9800; --glass: rgba(0, 0, 0, 0.85); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }

        /* --- VIDEO INTRO --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: flex; align-items: center; justify-content: center;
        }
        #intro-overlay video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        #btn-close-intro {
            position: absolute; bottom: 80px; padding: 12px 30px;
            background: rgba(255,255,255,0.25); border: 2px solid white; color: white;
            border-radius: 50px; cursor: pointer; z-index: 100001; backdrop-filter: blur(5px);
            font-weight: bold; pointer-events: auto; font-size: 16px; text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* --- BACKGROUND VR --- */
        #vr-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: none; }

        /* --- CANVAS VẼ NGƯỜI --- */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; touch-action: none; pointer-events: none; 
        }
        .canvas-active { pointer-events: auto !important; cursor: move; }

        /* --- GIAO DIỆN ĐIỀU KHIỂN --- */
        .ui-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 100; pointer-events: none; 
        }
        .interactive { pointer-events: auto; }

        .top-bar { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; }
        .btn-round { 
            width: 45px; height: 45px; border-radius: 50%; border: none; 
            background: var(--primary); color: white; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-round:active { transform: scale(0.9); }

        .controls {
            position: absolute; top: 75px; left: 15px; width: 280px;
            background: var(--glass); padding: 20px; border-radius: 15px;
            backdrop-filter: blur(10px); color: white; display: none;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls.show { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-full { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 14px; }
        
        /* --- THÔNG BÁO & LOADING --- */
        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); color: white; padding: 25px; border-radius: 15px;
            z-index: 200000; text-align: center; display: none; border: 1px solid #555; width: 85%; max-width: 300px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 300000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 40px; height: 40px; border: 4px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Nút cài đặt App (Chỉ hiện khi chưa cài) */
        #install-btn { display: none; background: #fff; color: #000; margin-top: 20px; }
    </style>
</head>
<body>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4"></video>
    <button id="btn-close-intro" onclick="closeIntro()">BẮT ĐẦU TRẢI NGHIỆM</button>
</div>

<div id="loading">
    <div class="loader"></div>
    <p style="font-size: 18px; font-weight: bold;">Đang xử lý AI...</p>
    <p style="font-size: 13px; color: #ccc; margin-top:5px; text-align:center;">Đang nén và tách nền...</p>
</div>

<iframe id="vr-frame" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>

<canvas id="ui-canvas"></canvas>

<div class="ui-container" id="main-ui">
    <div class="top-bar interactive">
        <button class="btn-round" onclick="switchTab('vr')">VR</button>
        <button class="btn-round" onclick="switchTab('shop')">SHOP</button>
        <button class="btn-round" onclick="toggleAI()">AI</button>
    </div>

    <div class="controls interactive" id="ai-menu">
        <h3 style="margin:0 0 15px 0; text-align:center; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;">Studio Ảnh Ảo</h3>
        
        <label for="input-file" class="btn-full" style="text-align:center; display:block; background: #3498db;">📸 Chọn Ảnh (Miễn phí)</label>
        <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="processLocalAI(this)">
        
        <div id="edit-area" style="display: none;">
            <p style="font-size:12px; margin:15px 0 5px 0">Kích thước người:</p>
            <input type="range" id="size-slider" min="0.1" max="2.0" step="0.01" value="0.7" style="width:100%" oninput="draw()">
            
            <p style="font-size: 11px; text-align: center; color: #ccc; margin-top: 10px;">💡 Giữ ngón tay vào người để di chuyển</p>
            
            <button class="btn-full" style="background: #27ae60; margin-top: 20px;" onclick="hideMode()">👁️ Chế độ chụp ảnh</button>
        </div>

        <button id="install-btn" class="btn-full" onclick="installApp()">📲 Cài đặt App vào máy</button>
    </div>
</div>

<div id="toast">
    <h3 style="margin-top:0; color: #2ecc71;">Sẵn sàng!</h3>
    <p>Giao diện đã ẩn.</p>
    <p style="font-weight: bold; font-size: 16px; color: #ff9800;">CHỤP MÀN HÌNH NGAY!</p>
</div>

<script>
    // --- 1. LOGIC CÀI ĐẶT APP (PWA) ---
    let deferredPrompt;
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker OK'))
                .catch(err => console.log('SW Fail', err));
        });
    }
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block'; // Hiện nút cài
    });
    async function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        }
    }

    // --- 2. KHỞI TẠO BIẾN ---
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const vrFrame = document.getElementById('vr-frame');
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // Full màn hình
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- 3. CÁC HÀM TIỆN ÍCH ---
    function closeIntro() {
        const intro = document.getElementById('intro-overlay');
        const video = document.getElementById('v-intro');
        if(video) video.pause();
        intro.style.opacity = '0';
        setTimeout(() => intro.remove(), 500);
    }

    function switchTab(tab) {
        if(tab === 'vr') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c";
        if(tab === 'shop') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb";
    }

    function toggleAI() {
        document.getElementById('ai-menu').classList.toggle('show');
    }

    // --- 4. HÀM NÉN ẢNH (QUAN TRỌNG ĐỂ CHỐNG LỖI) ---
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const elem = document.createElement('canvas');
                    // Giới hạn 1024px: Đủ nét, nhẹ, không lỗi bộ nhớ
                    const maxWidth = 1024; 
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                    elem.width = width;
                    elem.height = height;
                    const ctx = elem.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Xuất ra Blob JPEG 0.8 (Nhẹ)
                    elem.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.8);
                };
            };
        });
    }

    // --- 5. XỬ LÝ AI TÁCH NỀN ---
    async function processLocalAI(input) {
        if (!input.files[0]) return;
        
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';

        try {
            // Bước 1: Nén ảnh trước
            const compressedFile = await compressImage(input.files[0]);

            // Bước 2: Gửi ảnh đã nén vào AI
            const blob = await imglyRemoveBackground(compressedFile, {
                publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.0.3/dist/'
            });
            
            // Bước 3: Hiển thị kết quả
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                userImg = img;
                
                // Tính toán vị trí hiển thị
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.6;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 20;
                
                loading.style.display = 'none';
                document.getElementById('edit-area').style.display = 'block';
                canvas.classList.add('canvas-active');
                draw();
            };
            img.src = url;

        } catch (error) {
            console.error(error);
            alert("Lỗi: Máy không đủ bộ nhớ hoặc ảnh quá nặng. Hãy thử ảnh khác nhẹ hơn!");
            loading.style.display = 'none';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // --- 6. CHẾ ĐỘ CHỤP ẢNH ---
    function hideMode() {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('toast').style.display = 'block';
        setTimeout(() => { document.getElementById('toast').style.display = 'none'; }, 3000);
        setTimeout(() => { document.getElementById('main-ui').style.display = 'block'; }, 8000);
    }

    // --- 7. KÉO THẢ (TOUCH & MOUSE) ---
    function handleStart(e) {
        if (!userImg) return;
        const pos = e.touches ? e.touches[0] : e;
        const s = document.getElementById('size-slider').value;
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * s &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    
    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };
</script>
</body>
</html>
