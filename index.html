<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Manual Shot</title>
    <style>
        :root { --primary: #ff9800; --glass: rgba(0, 0, 0, 0.6); --text: #fff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }

        /* --- 1. LỚP VIDEO INTRO (Cao nhất) --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #btn-skip {
            position: absolute; bottom: 80px; padding: 12px 30px;
            background: rgba(255,255,255,0.2); border: 1px solid white; color: white;
            border-radius: 30px; cursor: pointer; z-index: 100000; backdrop-filter: blur(5px);
            font-size: 16px; font-weight: bold; pointer-events: auto; /* Bắt buộc */
        }

        /* --- 2. LỚP NỀN VR (Thấp nhất) --- */
        #vr-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: none; }

        /* --- 3. LỚP CANVAS NGƯỜI (Ở giữa) --- */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; touch-action: none; pointer-events: none; /* Mặc định cho phép bấm xuyên qua */
        }
        /* Khi có ảnh người thì bật cảm ứng lên, nhưng chỉ vùng cần thiết */
        .has-image { pointer-events: auto !important; }

        /* --- 4. GIAO DIỆN ĐIỀU KHIỂN (Trên canvas) --- */
        .ui-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: none; /* Để bấm xuyên qua vùng trống vào VR */
        }
        
        /* Các thành phần con phải bật lại pointer-events */
        .interactive { pointer-events: auto; }

        .top-bar { 
            position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; 
        }
        .btn-round { 
            width: 45px; height: 45px; border-radius: 50%; border: none; 
            background: var(--primary); color: white; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }

        /* Menu Công Cụ */
        .controls {
            position: absolute; top: 70px; left: 15px; width: 260px;
            background: var(--glass); padding: 15px; border-radius: 15px;
            backdrop-filter: blur(10px); color: white;
            display: none;
        }
        .controls.show { display: block; }

        .btn-action { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .hint { font-size: 11px; text-align: center; margin-top: 5px; color: #ddd; }

        /* Thông báo chụp ảnh */
        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 20px; border-radius: 10px;
            z-index: 20000; text-align: center; display: none;
        }

        /* Loading */
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 30000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4"></video>
    <button id="btn-skip" onclick="closeIntro()">BẮT ĐẦU</button>
</div>

<div id="loading"><div class="loader"></div><p id="load-text">Đang tách nền...</p></div>

<iframe id="vr-frame" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>

<canvas id="ui-canvas"></canvas>

<div class="ui-container" id="main-ui">
    <div class="top-bar interactive">
        <button class="btn-round" onclick="switchTab('vr')">VR</button>
        <button class="btn-round" onclick="switchTab('shop')">SHOP</button>
        <button class="btn-round" onclick="toggleAI()">AI</button>
    </div>

    <div class="controls interactive" id="ai-menu">
        <h3 style="margin:0 0 10px 0; text-align:center;">STUDIO NINH THUẬN</h3>
        
        <label for="input-file" class="btn-action" style="display:block; text-align:center; cursor:pointer">📸 Thêm Người</label>
        <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="processAI(this)">
        
        <div id="edit-area" style="display: none;">
            <p style="font-size:12px; margin:10px 0 5px 0">Chỉnh kích thước:</p>
            <input type="range" id="size-slider" min="0.1" max="2.5" step="0.01" value="0.8" style="width:100%" oninput="draw()">
            
            <p class="hint">💡 Chạm vào người để di chuyển</p>
            
            <button class="btn-action" style="background: #27ae60;" onclick="hideForScreenshot()">👁️ Ẩn nút để chụp ảnh</button>
        </div>
    </div>
</div>

<div id="toast">
    <h3>Sẵn sàng!</h3>
    <p>Hãy nhấn phím <b>Nguồn + Giảm âm lượng</b><br>để chụp màn hình ngay bây giờ.</p>
</div>

<script>
    // --- CẤU HÌNH ---
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";

    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const vrFrame = document.getElementById('vr-frame');

    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // Fix kích thước Canvas
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function closeIntro() {
        document.getElementById('intro-overlay').style.display = 'none';
        document.getElementById('v-intro').pause();
    }

    function switchTab(tab) {
        if(tab === 'vr') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c";
        if(tab === 'shop') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb";
    }

    function toggleAI() {
        document.getElementById('ai-menu').classList.toggle('show');
    }

    // --- TÁCH NỀN AI ---
    async function processAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = 'flex';
        
        const formData = new FormData();
        formData.append('file', input.files[0]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('edit-area').style.display = 'block';
                
                // Fix lỗi đơ: Chỉ bật cảm ứng canvas khi đã có ảnh
                canvas.classList.add('has-image');
                draw();
            };
            img.src = data.secure_url.replace('/upload/', '/upload/e_background_removal/');
        } catch (e) {
            alert("Lỗi tải ảnh");
            document.getElementById('loading').style.display = 'none';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // --- CHỨC NĂNG ẨN GIAO DIỆN (ĐỂ CHỤP MÀN HÌNH) ---
    function hideForScreenshot() {
        // 1. Ẩn toàn bộ nút bấm
        document.getElementById('main-ui').style.display = 'none';
        
        // 2. Hiện thông báo hướng dẫn
        const toast = document.getElementById('toast');
        toast.style.display = 'block';

        // 3. Sau 2 giây thì ẩn thông báo đi để màn hình sạch sẽ cho khách chụp
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2500);

        // 4. Sau 8 giây thì hiện lại nút bấm (đề phòng khách chụp xong muốn chỉnh tiếp)
        setTimeout(() => {
            document.getElementById('main-ui').style.display = 'block';
        }, 8000);
    }

    // --- DI CHUYỂN NGƯỜI ---
    // Mẹo: Nếu click vào khoảng trắng thì sự kiện sẽ xuyên qua xuống Iframe VR
    // Nếu click vào người thì sẽ bắt sự kiện di chuyển
    function handleStart(e) {
        if (!userImg) return;
        const pos = e.touches ? e.touches[0] : e;
        const s = document.getElementById('size-slider').value;
        
        // Kiểm tra xem có chạm trúng người không
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * s &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
            e.preventDefault(); // Chặn cuộn trang/xoay VR khi đang kéo người
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
        e.preventDefault();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    
    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };
</script>
</body>
</html>
