<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Thuận AI - Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #111; padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #333; width: 80%; max-width: 600px; }
        h1 { color: #ffcc00; font-size: 24px; margin-bottom: 30px; }
        .upload-zone { border: 2px dashed #444; padding: 40px; border-radius: 15px; cursor: pointer; transition: 0.3s; position: relative; }
        .upload-zone:hover { border-color: #ffcc00; background: #1a1a1a; }
        #file-input { display: none; }
        .loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); border-radius: 15px; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid #333; border-top: 4px solid #ffcc00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result { margin-top: 20px; display: none; }
        img { max-width: 100%; border-radius: 10px; margin-top: 10px; }
        .btn-download { background: #ffcc00; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>STUDIO AI</h1>
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <p>Kéo thả hoặc Click để TẢI ẢNH NGƯỜI</p>
        <input type="file" id="file-input" accept="image/*">
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <p style="margin-top:10px">AI ĐANG TÁCH NỀN...</p>
        </div>
    </div>

    <div id="result">
        <img id="output-img" src="" alt="Kết quả">
        <br>
        <button class="btn-download" id="download-btn">TẢI ẢNH VỀ</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const loader = document.getElementById('loader');
    const resultDiv = document.getElementById('result');
    const outputImg = document.getElementById('output-img');
    const downloadBtn = document.getElementById('download-btn');

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        loader.style.display = 'flex';
        resultDiv.style.display = 'none';

        try {
            // Sử dụng thư viện imgly để tách nền ngay trên trình duyệt
            const blob = await imglyRemoveBackground(file);
            const url = URL.createObjectURL(blob);
            
            outputImg.src = url;
            resultDiv.style.display = 'block';

            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ninh-thuan-ai-result.png';
                a.click();
            };
        } catch (err) {
            console.error(err);
            alert("Có lỗi xảy ra khi AI tách nền. Hãy thử ảnh khác!");
        } finally {
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
