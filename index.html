<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Final Stable</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #FF6B00; --bg-panel: rgba(20, 20, 20, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* --- 1. INTRO (Xử lý kỹ để không hiện lại) --- */
        #intro-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }
        .skip-btn {
            position: absolute; bottom: 50px; padding: 12px 25px; 
            border: 1px solid white; color: white; border-radius: 30px; 
            background: rgba(0,0,0,0.6); cursor: pointer; z-index: 10000;
            font-weight: bold; font-size: 14px;
        }

        /* --- 2. LAYOUT IFRAME (Kỹ thuật Z-Index Swapping) --- */
        /* Container chứa cả 2 iframe */
        .tour-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        
        .tour-frame {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
            /* Mặc định nằm dưới */
            z-index: 1; 
            opacity: 0; /* Làm mờ để không bị nháy hình */
            transition: opacity 0.3s; 
            pointer-events: none; /* Không cho bấm khi đang ẩn */
        }

        /* Class kích hoạt: Đẩy lên trên và hiện rõ */
        .tour-frame.active {
            z-index: 5; /* Cao hơn layer kia */
            opacity: 1;
            pointer-events: auto;
        }

        /* Canvas AI nằm đè lên trên tất cả các iframe */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; pointer-events: none; 
        }

        /* --- 3. UI ĐIỀU KHIỂN --- */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .nav-switch { background: rgba(255,255,255,0.2); border-radius: 30px; padding: 4px; display: flex; }
        .nav-btn {
            background: transparent; border: none; color: #ddd; padding: 8px 16px; 
            border-radius: 25px; font-weight: 600; font-size: 13px; cursor: pointer;
        }
        .nav-btn.active { background: #fff; color: #000; }
        .btn-ai {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--primary); color: white; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* --- 4. PANEL AI --- */
        .ai-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--bg-panel); border-radius: 20px 20px 0 0;
            padding: 20px; z-index: 200; transform: translateY(110%);
            transition: transform 0.3s ease; color: white;
            display: flex; flex-direction: column; gap: 10px;
        }
        .ai-panel.visible { transform: translateY(0); }
        .btn-full { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px;}
        .btn-upload { background: #333; color: white; border: 1px solid #555; }
        .btn-save { background: #27ae60; color: white; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000; display: none;
            align-items: center; justify-content: center; flex-direction: column; color: white;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:10px; font-size: 12px;">ĐANG XỬ LÝ...</p></div>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <div class="skip-btn" onclick="finishIntro()">BẮT ĐẦU TRẢI NGHIỆM <i class="fas fa-arrow-right"></i></div>
</div>

<div class="top-bar">
    <div class="nav-switch">
        <button class="nav-btn active" id="btn-vr" onclick="switchFrame('vr')">VR Tour</button>
        <button class="nav-btn" id="btn-shop" onclick="switchFrame('shop')">Gian Hàng</button>
    </div>
    <button class="btn-ai" onclick="toggleAI()"><i class="fas fa-magic"></i></button>
</div>

<div class="tour-container">
    <iframe id="frame-vr" class="tour-frame active" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="tour-frame" src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="ui-canvas"></canvas>

<div class="ai-panel" id="ai-panel">
    <div style="display:flex; justify-content:space-between;">
        <span>STUDIO ẢO</span>
        <i class="fas fa-times" onclick="toggleAI()" style="cursor:pointer; padding:5px;"></i>
    </div>
    <button class="btn-full btn-upload" onclick="document.getElementById('inp-file').click()">
        <i class="fas fa-image"></i> Chọn Ảnh (Tự tách nền)
    </button>
    <input type="file" id="inp-file" hidden accept="image/*" onchange="processAI(this)">
    
    <div id="save-box" style="display:none">
        <p style="font-size:11px; color:#aaa; text-align:center;">Di chuyển 1 ngón - Zoom 2 ngón</p>
        <button class="btn-full btn-save" onclick="saveImage()">
            <i class="fas fa-download"></i> Lưu Ảnh
        </button>
    </div>
</div>

<script>
    // --- 1. XỬ LÝ INTRO ---
    function finishIntro() {
        const intro = document.getElementById('intro-overlay');
        if(intro) {
            intro.style.opacity = 0;
            // XÓA HẲN khỏi DOM để không bao giờ hiện lại
            setTimeout(() => intro.remove(), 500); 
        }
    }

    // --- 2. CHUYỂN TAB (GIỮ NGUYÊN TRẠNG THÁI) ---
    function switchFrame(type) {
        finishIntro(); // Đảm bảo intro tắt nếu lỡ bấm nút khi intro đang chạy
        
        // Cập nhật nút bấm
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');

        // Cập nhật Iframe (Swap Class)
        // Kỹ thuật này không reload lại iframe nên giữ nguyên vị trí đang xem
        document.querySelectorAll('.tour-frame').forEach(f => f.classList.remove('active'));
        document.getElementById('frame-' + type).classList.add('active');
    }

    // --- 3. XỬ LÝ AI & FALLBACK (SỬA LỖI KHÔNG HIỆN ẢNH) ---
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let aiImg = null;
    let imgState = { x: 0, y: 0, w: 0, h: 0 };

    window.onload = () => { resizeCanvas(); };
    window.onresize = resizeCanvas;
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drawAI(); }

    function toggleAI() {
        finishIntro();
        document.getElementById('ai-panel').classList.toggle('visible');
    }

    async function processAI(input) {
        if (!input.files[0]) return;
        
        document.getElementById('loader').style.display = 'flex';
        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData
            });

            if (!res.ok) throw new Error("API Error");

            const blob = await res.blob();
            loadImgToCanvas(blob);

        } catch (e) {
            // --- SỬA LỖI QUAN TRỌNG TẠI ĐÂY ---
            alert("Hết lượt AI hoặc lỗi mạng. Chuyển sang dùng ảnh gốc!");
            // Nếu lỗi, dùng chính file gốc để vẽ
            loadImgToCanvas(input.files[0]);
        }
    }

    function loadImgToCanvas(source) {
        const img = new Image();
        img.onload = () => {
            aiImg = img;
            // Tính toán vị trí
            const ratio = img.width / img.height;
            imgState.h = canvas.height * 0.5; // Cao 50% màn hình
            imgState.w = imgState.h * ratio;
            imgState.x = (canvas.width - imgState.w) / 2;
            imgState.y = canvas.height - imgState.h - 100;

            // Bật UI lưu
            document.getElementById('loader').style.display = 'none';
            document.getElementById('save-box').style.display = 'block';
            canvas.style.pointerEvents = "auto"; // Cho phép thao tác
            drawAI();
        };
        // Hỗ trợ cả Blob (từ API) và File (từ input)
        img.src = URL.createObjectURL(source);
    }

    function drawAI() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (aiImg) ctx.drawImage(aiImg, imgState.x, imgState.y, imgState.w, imgState.h);
    }

    // --- 4. TOUCH EVENTS (DI CHUYỂN ẢNH) ---
    let isDragging = false, startX, startY;
    
    canvas.addEventListener('touchstart', e => {
        const t = e.touches[0];
        if (t.clientX > imgState.x && t.clientX < imgState.x + imgState.w &&
            t.clientY > imgState.y && t.clientY < imgState.y + imgState.h) {
            isDragging = true;
            startX = t.clientX - imgState.x;
            startY = t.clientY - imgState.y;
        }
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
        if(isDragging) {
            e.preventDefault();
            const t = e.touches[0];
            imgState.x = t.clientX - startX;
            imgState.y = t.clientY - startY;
            drawAI();
        }
    }, {passive: false});
    
    canvas.addEventListener('touchend', () => isDragging = false);

    function saveImage() {
        if(confirm("Tải ảnh nhân vật về máy? (Lưu ý: Không thể chụp kèm cảnh nền VR do bảo mật trình duyệt)")) {
            const a = document.createElement('a');
            a.download = 'nhan-vat.png';
            a.href = canvas.toDataURL();
            a.click();
        }
    }
</script>
</body>
</html>
