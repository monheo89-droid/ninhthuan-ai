<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Performance Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CẤU HÌNH TỐI ƯU --- */
        :root { --primary: #FF6B00; --glass: rgba(20, 20, 20, 0.9); }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; font-family: sans-serif; 
            user-select: none; -webkit-touch-callout: none;
            touch-action: none; /* Chặn cuộn trang tuyệt đối */
        }

        /* VIEWPORT */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        
        /* IFRAME: Dùng visibility để tắt render khi ẩn */
        .iframe-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
            z-index: 1; opacity: 0; visibility: hidden; transition: opacity 0.5s;
        }
        .iframe-layer.active { z-index: 5; opacity: 1; visibility: visible; }

        /* CANVAS */
        #studio-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; touch-action: none; pointer-events: auto; 
        }
        /* Chế độ Tour: Tắt cảm ứng canvas để xuyên qua */
        body.tour-mode #studio-canvas { pointer-events: none; }

        /* UI CONTROLS */
        .right-dock {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            z-index: 9000; display: flex; flex-direction: column; gap: 10px; align-items: center;
            background: var(--glass); padding: 12px 6px; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); transition: opacity 0.3s;
        }

        .tool-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #ccc; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tool-btn.btn-cam { border: 2px solid white; color: white; background: transparent; }

        .mode-switcher { display: flex; flex-direction: column; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 25px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .mode-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: #666; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: #fff; }

        .slider-container { height: 100px; width: 40px; display: flex; justify-content: center; padding: 5px 0; }
        input[type=range] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 10px; height: 100%; background: rgba(255,255,255,0.3); border-radius: 3px; outline: none; }

        .top-bar { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; transition: opacity 0.3s; }
        .nav-btn { background: rgba(255,255,255,0.2); color: #ddd; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 12px; border: none; cursor: pointer; }
        .nav-btn.active { background: #fff; color: #000; }

        /* MASK (LITE) */
        #mask-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998;
            background: rgba(0,0,0,0.95); opacity: 0; pointer-events: none; transition: opacity 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        #mask-overlay.active { opacity: 1; }
        
        .mask-hole {
            width: 45vh; height: 56.25vh; /* Tỷ lệ 4:5 */
            border: 2px dashed rgba(255,255,255,0.5);
            background: transparent;
            box-shadow: 0 0 0 100vmax rgba(0,0,0,0.95); /* Kỹ thuật che tối nhẹ hơn */
        }
        
        body.capture-mode .top-bar, body.capture-mode .right-dock { opacity: 0; pointer-events: none; }
        
        #loader, #count-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; background: #000; }
        #count-layer { font-size: 100px; font-weight: 900; background: transparent; pointer-events: none; }
        .spinner { width: 30px; height: 30px; border: 3px solid #555; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 11000; display: none; pointer-events: none; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:10px;font-size:12px">ĐANG TẢI...</p></div>
<div id="count-layer">3</div>
<div id="toast-msg" class="toast">Thông báo</div>

<div id="mask-overlay">
    <div class="mask-hole"></div>
</div>

<div class="top-bar">
    <button class="nav-btn active" id="btn-vr" onclick="App.switch('vr')">VR Tour</button>
    <button class="nav-btn" id="btn-shop" onclick="App.switch('shop')">Gian Hàng</button>
</div>

<div class="right-dock">
    <div class="mode-switcher">
        <button class="mode-btn active" id="btn-mode-person" onclick="Studio.setMode('person')"><i class="fas fa-user-edit"></i></button>
        <button class="mode-btn" id="btn-mode-tour" onclick="Studio.setMode('tour')"><i class="fas fa-street-view"></i></button>
    </div>
    <button class="tool-btn" onclick="document.getElementById('inp-file').click()"><i class="fas fa-plus"></i></button>
    <input type="file" id="inp-file" hidden accept="image/*" onchange="Studio.handleFile(this)">
    <div class="slider-container">
        <input type="range" id="scale-slider" min="0.1" max="3.0" step="0.05" value="1.0" oninput="Studio.setScale(this.value)">
    </div>
    <button class="tool-btn" onclick="Studio.flip()"><i class="fas fa-exchange-alt"></i></button>
    <button class="tool-btn btn-cam" onclick="App.capture()"><i class="fas fa-camera"></i></button>
</div>

<div class="viewport">
    <iframe id="frame-vr" class="iframe-layer" data-src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="iframe-layer" data-src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="studio-canvas"></canvas>

<div id="intro-layer" style="position:fixed;top:0;left:0;width:1
