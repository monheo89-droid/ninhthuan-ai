<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuan AI - Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #FF6B00; /* Cam cháy sang trọng */
            --bg-panel: rgba(20, 20, 20, 0.95);
            --text-light: #ffffff;
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* --- 1. VIDEO INTRO --- */
        #intro-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }
        .skip-btn {
            position: absolute; bottom: 40px; padding: 10px 20px; 
            border: 1px solid white; color: white; border-radius: 20px; 
            background: rgba(0,0,0,0.5); cursor: pointer; z-index: 10000;
        }

        /* --- 2. LAYOUT IFRAME (Sửa lỗi đen màn hình) --- */
        /* Chúng ta dùng 1 container chung, thay đổi src bằng JS */
        #vr-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: #000;
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Canvas để vẽ nhân vật AI đè lên trên */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; pointer-events: none; /* Để bấm xuyên qua canvas vào iframe */
        }

        /* --- 3. THANH ĐIỀU HƯỚNG (TOP BAR) --- */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        
        .nav-switch {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 30px; padding: 4px; display: flex;
        }
        .nav-btn {
            background: transparent; border: none; color: #ccc;
            padding: 8px 16px; border-radius: 25px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: 0.3s;
        }
        .nav-btn.active { background: #fff; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .btn-ai {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--primary); color: white; font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.4);
        }

        /* --- 4. LOADING SPINNER --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: none;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- 5. MENU AI STUDIO (Gọn gàng bên dưới) --- */
        .ai-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--bg-panel); border-radius: 20px 20px 0 0;
            padding: 20px; z-index: 200; transform: translateY(110%);
            transition: transform 0.3s ease; display: flex; flex-direction: column; gap: 15px;
        }
        .ai-panel.visible { transform: translateY(0); }
        .ai-panel h3 { color: white; margin: 0 0 10px 0; font-size: 16px; text-align: center; }

        .btn-full {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-upload { background: #333; color: white; border: 1px solid #555; }
        .btn-save { background: #27ae60; color: white; }
        .close-panel { position: absolute; top: 15px; right: 20px; color: #888; cursor: pointer; }

    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="color: #888; margin-top: 10px; font-size: 12px;">ĐANG TẢI DỮ LIỆU...</p>
</div>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline>
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <div class="skip-btn" onclick="closeIntro()">BẮT ĐẦU <i class="fas fa-arrow-right"></i></div>
</div>

<div class="top-bar">
    <div class="nav-switch">
        <button class="nav-btn active" id="btn-vr" onclick="loadTour('vr')">VR Tour</button>
        <button class="nav-btn" id="btn-shop" onclick="loadTour('shop')">Gian Hàng</button>
    </div>
    <button class="btn-ai" onclick="toggleAI()"><i class="fas fa-magic"></i></button>
</div>

<div id="vr-container">
    <iframe id="main-frame" src="" allowfullscreen></iframe>
</div>

<canvas id="ui-canvas"></canvas>

<div class="ai-panel" id="ai-panel">
    <i class="fas fa-times close-panel" onclick="toggleAI()"></i>
    <h3>STUDIO AI</h3>
    
    <button class="btn-full btn-upload" onclick="document.getElementById('inp-file').click()">
        <i class="fas fa-user-plus"></i> Tải ảnh lên & Tách nền
    </button>
    <input type="file" id="inp-file" hidden accept="image/*" onchange="processAI(this)">

    <div id="ai-controls" style="display:none; text-align: center;">
        <p style="color: #aaa; font-size: 12px; margin: 10px 0;">Kéo thả để di chuyển - 2 ngón tay để zoom</p>
        <button class="btn-full btn-save" onclick="saveImage()">
            <i class="fas fa-download"></i> Lưu Bưu Thiếp
        </button>
    </div>
</div>

<script>
    // --- CẤU HÌNH LINK TOUR ---
    const LINKS = {
        vr: "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c",
        shop: "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"
    };
    
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC"; // Key remove.bg của bạn
    let currentTab = 'vr';

    // Khởi tạo
    window.onload = () => {
        resizeCanvas();
        // Preload tour VR ban đầu nhưng chưa chạy video intro xong thì chưa hiện vội
        // Nhưng logic intro của bạn là overlay, nên ta cứ load iframe ở dưới
        document.getElementById('main-frame').src = LINKS.vr;
    };
    window.onresize = resizeCanvas;

    // --- XỬ LÝ CHUYỂN TAB (FIX LỖI ĐEN MÀN HÌNH) ---
    function loadTour(type) {
        if (currentTab === type) return; // Đang ở tab này rồi thì thôi
        
        closeIntro(); // Đảm bảo tắt intro
        
        // 1. Hiện loading để che đi lúc iframe load lại
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';

        // 2. Cập nhật nút active
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');

        // 3. Reset src của iframe (Kỹ thuật Unload để giải phóng WebGL cũ)
        const iframe = document.getElementById('main-frame');
        iframe.src = "about:blank"; // Xóa trắng iframe

        setTimeout(() => {
            // 4. Load link mới sau 100ms
            iframe.src = LINKS[type];
            currentTab = type;
            
            // Tắt loading khi iframe load xong (ước lượng hoặc sự kiện onload)
            iframe.onload = () => {
                loader.style.display = 'none';
            };
        }, 100);
    }

    function closeIntro() {
        const intro = document.getElementById('intro-overlay');
        if(intro) {
            intro.style.opacity = 0;
            document.getElementById('v-intro').pause();
            setTimeout(() => intro.remove(), 500);
        }
    }

    // --- AI & CANVAS LOGIC ---
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let aiImg = null;
    let imgState = { x: 0, y: 0, w: 0, h: 0, scale: 1 };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawAI();
    }

    function toggleAI() {
        closeIntro();
        document.getElementById('ai-panel').classList.toggle('visible');
    }

    async function processAI(input) {
        if (!input.files[0]) return;
        
        // Hiện loading
        const loader = document.getElementById('loader');
        loader.innerHTML = '<div class="spinner"></div><p style="color:white; margin-top:10px">AI ĐANG TÁCH NỀN...</p>';
        loader.style.display = 'flex';

        const formData = new FormData();
        formData.append("image_file", input.files[0]);

        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData
            });
            
            if(!res.ok) throw new Error("Lỗi API");
            
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                aiImg = img;
                // Căn giữa ảnh
                const ratio = img.width / img.height;
                imgState.h = canvas.height * 0.6; 
                imgState.w = imgState.h * ratio;
                imgState.x = (canvas.width - imgState.w) / 2;
                imgState.y = canvas.height - imgState.h - 50;
                
                // Bật chế độ thao tác
                canvas.style.pointerEvents = "auto"; // Cho phép chạm vào canvas để kéo ảnh
                document.getElementById('ai-controls').style.display = "block";
                
                loader.style.display = 'none';
                drawAI();
            };
            img.src = URL.createObjectURL(blob);

        } catch (e) {
            alert("Lỗi hoặc hết lượt Free API. Dùng ảnh gốc.");
            loader.style.display = 'none';
        }
    }

    function drawAI() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (aiImg) {
            ctx.drawImage(aiImg, imgState.x, imgState.y, imgState.w, imgState.h);
        }
    }

    // --- THAO TÁC KÉO THẢ (TOUCH) ---
    let isDragging = false;
    let startX, startY;

    canvas.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        // Kiểm tra xem có chạm vào ảnh không
        if (touch.clientX >= imgState.x && touch.clientX <= imgState.x + imgState.w &&
            touch.clientY >= imgState.y && touch.clientY <= imgState.y + imgState.h) {
            isDragging = true;
            startX = touch.clientX - imgState.x;
            startY = touch.clientY - imgState.y;
        }
    });

    canvas.addEventListener('touchmove', e => {
        if (isDragging) {
            e.preventDefault(); // Chặn cuộn trang
            const touch = e.touches[0];
            imgState.x = touch.clientX - startX;
            imgState.y = touch.clientY - startY;
            drawAI();
        }
    });

    canvas.addEventListener('touchend', () => isDragging = false);

    // --- LƯU ẢNH ---
    function saveImage() {
        // Cảnh báo về việc không chụp được iframe
        if(confirm("Lưu ý: Do bảo mật trình duyệt, chức năng này sẽ lưu ảnh nhân vật (nền trong suốt). Bạn hãy dùng chức năng 'Chụp màn hình' của điện thoại để có cả cảnh nền 360 đẹp nhất nhé!")) {
            const link = document.createElement('a');
            link.download = 'nhan-vat-ai.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    }
</script>
</body>
</html>
