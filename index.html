<script>
    // --- CẤU HÌNH ---
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";

    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const vrFrame = document.getElementById('vr-frame');

    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // Thiết lập Canvas full màn hình
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. Đóng Intro Video
    function closeIntro() {
        const intro = document.getElementById('intro-overlay');
        const video = document.getElementById('v-intro');
        if(video) video.pause();
        if(intro) {
            intro.style.opacity = '0';
            setTimeout(() => intro.remove(), 500);
        }
    }

    // 2. Chuyển Tab
    function switchTab(tab) {
        if(tab === 'vr') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c";
        if(tab === 'shop') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb";
    }

    function toggleAI() {
        document.getElementById('ai-menu').classList.toggle('show');
    }

    // --- HÀM MỚI: NÉN ẢNH TRƯỚC KHI GỬI (GIẢM THỜI GIAN CHỜ) ---
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                // Tạo canvas ảo để vẽ lại ảnh nhỏ hơn
                const elem = document.createElement('canvas');
                const maxWidth = 1024; // Giới hạn chiều rộng 1024px (Đủ nét cho web)
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height *= maxWidth / width;
                    width = maxWidth;
                }
                
                elem.width = width;
                elem.height = height;
                const ctx = elem.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Xuất ra dạng Blob (giảm chất lượng xuống 0.8 để nhẹ hơn)
                ctx.canvas.toBlob((blob) => {
                    callback(blob);
                }, 'image/jpeg', 0.8);
            }
        }
    }

    // 3. Xử lý AI (Đã tích hợp nén ảnh)
    function processAI(input) {
        if (!input.files[0]) return;
        
        // Hiện loading
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';
        loading.innerHTML = '<div class="loader"></div><p>Đang nén & Tách nền...</p>';

        // Gọi hàm nén ảnh trước
        compressImage(input.files[0], async (compressedBlob) => {
            const formData = new FormData();
            formData.append('file', compressedBlob);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                // Gửi ảnh đã nén lên Server
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    userImg = img;
                    // Tính toán vị trí
                    const ratio = img.width / img.height;
                    imgPos.h = canvas.height * 0.6;
                    imgPos.w = imgPos.h * ratio;
                    imgPos.x = (canvas.width - imgPos.w) / 2;
                    imgPos.y = canvas.height - imgPos.h - 20;
                    
                    loading.style.display = 'none';
                    document.getElementById('edit-area').style.display = 'block';
                    canvas.classList.add('canvas-active');
                    draw();
                };
                
                // Link ảnh đã tách nền
                let processedUrl = data.secure_url;
                if (processedUrl.includes('/upload/')) {
                    processedUrl = processedUrl.replace('/upload/', '/upload/e_background_removal/f_png/');
                }
                img.src = processedUrl;

            } catch (e) {
                alert("Lỗi kết nối. Vui lòng thử lại!");
                loading.style.display = 'none';
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // 4. Chế độ Chụp Ảnh
    function hideMode() {
        document.getElementById('main-ui').style.display = 'none';
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
        setTimeout(() => { document.getElementById('main-ui').style.display = 'block'; }, 8000);
    }

    // 5. Logic Kéo Thả
    function handleStart(e) {
        if (!userImg) return;
        const pos = e.touches ? e.touches[0] : e;
        const s = document.getElementById('size-slider').value;
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * s &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    
    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };
</script>
