<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Final Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --glass: rgba(0, 0, 0, 0.7); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* --- 1. LỚP VIDEO INTRO (Cao nhất: Z-Index 100,000) --- */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: flex; align-items: center; justify-content: center;
        }
        #intro-overlay video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        /* Nút đóng clip: Phải có pointer-events: auto để bấm được */
        #btn-close-intro {
            position: absolute; bottom: 80px; padding: 12px 30px;
            background: rgba(255,255,255,0.2); border: 1px solid white; color: white;
            border-radius: 30px; cursor: pointer; z-index: 100001; backdrop-filter: blur(5px);
            font-weight: bold; pointer-events: auto; 
        }

        /* --- 2. LỚP NỀN VR (Thấp nhất: Z-Index 1) --- */
        #vr-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; border: none; }

        /* --- 3. LỚP CANVAS VẼ NGƯỜI (Ở giữa: Z-Index 50) --- */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; touch-action: none; 
            pointer-events: none; /* Mặc định cho phép bấm xuyên qua để xoay VR */
        }
        /* Khi có ảnh người thì bật cảm ứng lên để kéo thả */
        .has-image { pointer-events: auto !important; }

        /* --- 4. GIAO DIỆN ĐIỀU KHIỂN (Trên Canvas: Z-Index 100) --- */
        /* UI Container phải cho phép bấm xuyên qua vùng trống */
        .ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
        
        /* Các nút bên trong phải bật lại cảm ứng */
        .interactive { pointer-events: auto; }

        .top-bar { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; }
        .btn-round { 
            width: 45px; height: 45px; border-radius: 50%; border: none; 
            background: var(--primary); color: white; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }

        /* Menu AI */
        .controls {
            position: absolute; top: 70px; left: 15px; width: 260px;
            background: var(--glass); padding: 15px; border-radius: 15px;
            backdrop-filter: blur(10px); color: white; display: none;
        }
        .controls.show { display: block; }

        .btn-full { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .hint { font-size: 11px; text-align: center; margin-top: 5px; color: #ccc; }

        /* Thông báo */
        #toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); color: white; padding: 20px; border-radius: 10px;
            z-index: 200000; text-align: center; display: none; border: 1px solid #555;
        }

        /* Loading */
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 300000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 30px; height: 30px; border: 3px solid #fff; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4"></video>
    <button id="btn-close-intro" onclick="closeIntro()">BẮT ĐẦU TRẢI NGHIỆM</button>
</div>

<div id="loading"><div class="loader"></div><p>Đang tách nền...</p></div>

<iframe id="vr-frame" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe>

<canvas id="ui-canvas"></canvas>

<div class="ui-container" id="main-ui">
    <div class="top-bar interactive">
        <button class="btn-round" onclick="switchTab('vr')">VR</button>
        <button class="btn-round" onclick="switchTab('shop')">SHOP</button>
        <button class="btn-round" onclick="toggleAI()">AI</button>
    </div>

    <div class="controls interactive" id="ai-menu">
        <h3 style="margin:0 0 10px 0; text-align:center;">STUDIO ẢNH</h3>
        
        <label for="input-file" class="btn-full" style="text-align:center">📸 Chọn Ảnh Người</label>
        <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="processAI(this)">
        
        <div id="edit-area" style="display: none;">
            <p style="font-size:12px; margin:10px 0 5px 0">Kích thước:</p>
            <input type="range" id="size-slider" min="0.1" max="2.5" step="0.01" value="0.8" style="width:100%" oninput="draw()">
            
            <p class="hint">💡 Chạm vào người để di chuyển</p>
            
            <button class="btn-full" style="background: #27ae60;" onclick="hideMode()">👁️ Chế độ chụp ảnh</button>
        </div>
    </div>
</div>

<div id="toast">
    <h3>Sẵn sàng!</h3>
    <p>Hãy bấm nút chụp màn hình trên điện thoại của bạn ngay bây giờ.</p>
    <p style="font-size:12px; color:#aaa">(Giao diện sẽ hiện lại sau 5 giây)</p>
</div>

<script>
    // --- CẤU HÌNH ---
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";

    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const vrFrame = document.getElementById('vr-frame');

    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // Full màn hình
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 1. Đóng Intro Video (Đảm bảo nút hoạt động)
    function closeIntro() {
        const intro = document.getElementById('intro-overlay');
        intro.style.display = 'none';
        document.getElementById('v-intro').pause();
        // Xóa luôn khỏi DOM để chắc chắn không che nút khác
        intro.remove();
    }

    // 2. Chuyển Tab VR / Shop
    function switchTab(tab) {
        if(tab === 'vr') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c";
        if(tab === 'shop') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb";
    }

    function toggleAI() {
        document.getElementById('ai-menu').classList.toggle('show');
    }

    // 3. Xử lý AI Tách Nền
    async function processAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = 'flex';

        const formData = new FormData();
        formData.append('file', input.files[0]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('edit-area').style.display = 'block';
                
                // QUAN TRỌNG: Bật cảm ứng cho Canvas khi đã có người
                canvas.classList.add('has-image');
                draw();
            };
            // FIX NỀN TRẮNG: Thêm f_png để ép trong suốt
            img.src = data.secure_url.replace('/upload/', '/upload/e_background_removal/f_png/');
        } catch (e) {
            alert("Lỗi kết nối. Vui lòng thử lại!");
            document.getElementById('loading').style.display = 'none';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // 4. Chế độ Chụp Ảnh (Ẩn UI)
    function hideMode() {
        document.getElementById('main-ui').style.display = 'none'; // Ẩn nút
        document.getElementById('toast').style.display = 'block'; // Hiện thông báo

        // Sau 2s ẩn thông báo -> Màn hình sạch
        setTimeout(() => {
            document.getElementById('toast').style.display = 'none';
        }, 2000);

        // Sau 8s hiện lại nút
        setTimeout(() => {
            document.getElementById('main-ui').style.display = 'block';
        }, 8000);
    }

    // 5. Logic Kéo Thả Người
    function handleStart(e) {
        if (!userImg) return;
        const pos = e.touches ? e.touches[0] : e;
        const s = document.getElementById('size-slider').value;
        
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * s &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
            e.preventDefault(); // Chặn xoay VR khi đang kéo người
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
        e.preventDefault();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    
    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };
</script>
</body>
</html>
