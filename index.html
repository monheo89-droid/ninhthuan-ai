<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Xóa Nền Ảnh Miễn Phí</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 2em;
        }
        .upload-section {
            margin-bottom: 30px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .upload-section:hover {
            border-color: #007bff;
        }
        .upload-section p {
            margin: 0;
            color: #666;
            font-size: 1.1em;
        }
        .upload-section input[type="file"] {
            display: none;
        }
        .button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
            margin-top: 15px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .image-preview {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .image-wrapper {
            flex: 1;
            min-width: 280px;
            margin: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f9f9f9;
        }
        .image-wrapper h3 {
            background-color: #eee;
            margin: 0;
            padding: 10px;
            font-size: 1.1em;
            color: #555;
            border-bottom: 1px solid #ddd;
        }
        .image-wrapper img {
            max-width: 100%;
            height: auto;
            max-height: 300px; /* Giới hạn chiều cao để không quá lớn */
            display: block;
            margin: auto;
            padding: 15px;
        }
        .loading-overlay {
            display: none; /* Ẩn ban đầu */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        .loading-spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #007bff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #333;
            font-size: 1.2em;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal"></script>
</head>
<body>
    <div class="container">
        <h1>Công Cụ Xóa Nền Ảnh Miễn Phí</h1>
        <div class="upload-section" id="upload-area">
            <input type="file" id="image-upload" accept="image/*">
            <p>Kéo & Thả ảnh vào đây, hoặc nhấn để chọn ảnh</p>
            <button class="button" onclick="document.getElementById('image-upload').click()">Chọn Ảnh</button>
        </div>

        <div class="image-preview">
            <div class="image-wrapper">
                <h3>Ảnh Gốc</h3>
                <img id="original-image" src="" alt="Ảnh Gốc" style="display:none;">
                <p id="original-placeholder">Chưa có ảnh</p>
            </div>
            <div class="image-wrapper">
                <h3>Ảnh Đã Xóa Nền</h3>
                <img id="processed-image" src="" alt="Ảnh Đã Xóa Nền" style="display:none;">
                <p id="processed-placeholder">Chưa có ảnh</p>
            </div>
        </div>

        <button class="button" id="download-button" style="display:none; margin-top: 30px;">Tải Ảnh Đã Xóa Nền Về</button>
    </div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Đang xử lý ảnh, vui lòng đợi...</div>
    </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const uploadArea = document.getElementById('upload-area');
        const originalImage = document.getElementById('original-image');
        const processedImage = document.getElementById('processed-image');
        const originalPlaceholder = document.getElementById('original-placeholder');
        const processedPlaceholder = document.getElementById('processed-placeholder');
        const downloadButton = document.getElementById('download-button');
        const loadingOverlay = document.getElementById('loading-overlay');

        let processedBlob = null; // Lưu trữ blob của ảnh đã xử lý để tải về

        // Xử lý kéo và thả
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#007bff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                imageUpload.files = files;
                handleImageUpload();
            }
        });

        // Xử lý khi chọn ảnh bằng nút bấm hoặc kéo thả
        imageUpload.addEventListener('change', handleImageUpload);

        async function handleImageUpload() {
            const file = imageUpload.files[0];
            if (!file) return;

            // Ẩn placeholder, hiện ảnh
            originalPlaceholder.style.display = 'none';
            processedPlaceholder.style.display = 'none';
            originalImage.style.display = 'block';
            processedImage.style.display = 'none'; // Ẩn ảnh đã xử lý cho đến khi xong
            downloadButton.style.display = 'none';

            // Hiển thị ảnh gốc
            const originalImageUrl = URL.createObjectURL(file);
            originalImage.src = originalImageUrl;

            // Hiển thị overlay loading
            loadingOverlay.style.display = 'flex';

            try {
                // Xử lý xóa nền bằng @imgly/background-removal
                // Thêm option để tăng độ chính xác nếu cần (mặc định đã tốt)
                const blob = await imglyRemoveBackground(file, {
                    // Cấu hình tùy chọn, ví dụ:
                    // publicPath: 'path/to/models', // Nếu bạn muốn lưu model cục bộ
                    // debug: true, // Để xem thêm log lỗi nếu có
                });

                processedBlob = blob; // Lưu blob để tải về sau
                const processedImageUrl = URL.createObjectURL(blob);
                processedImage.src = processedImageUrl;
                processedImage.style.display = 'block'; // Hiện ảnh đã xử lý
                downloadButton.style.display = 'block'; // Hiện nút tải về

            } catch (error) {
                console.error("Lỗi khi xóa nền:", error);
                alert("Rất tiếc, có lỗi xảy ra khi xóa nền ảnh của bạn. Vui lòng thử lại với ảnh khác!");
                processedPlaceholder.style.display = 'block';
                processedImage.style.display = 'none';
            } finally {
                // Ẩn overlay loading
                loadingOverlay.style.display = 'none';
            }
        }

        // Xử lý nút tải về
        downloadButton.addEventListener('click', () => {
            if (processedBlob) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(processedBlob);
                a.download = `anh-da-xoa-nen-${Date.now()}.png`; // Tên file
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href); // Giải phóng bộ nhớ
            }
        });
    </script>
</body>
</html>
