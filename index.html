<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninh Thuận AI - Mobile Optimized</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --success: #27ae60; --glass: rgba(255, 255, 255, 0.9); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #000; }

        /* --- INTRO LAYER --- */
        #intro-overlay { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #intro-overlay video { width: 100%; height: 100%; object-fit: cover; }
        .start-btn { position: absolute; bottom: 15%; background: var(--primary); color: #fff; padding: 15px 30px; border-radius: 40px; border: 2px solid #fff; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; z-index: 100000; }

        /* --- NAVIGATION & IFRAMES --- */
        .pano-page { position: absolute; inset: 0; visibility: hidden; z-index: 1; }
        .pano-page.active { visibility: visible; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- SIDEBAR UI (Tránh che chính giữa) --- */
        .ui-sidebar { position: absolute; top: 20px; left: 15px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .round-btn { width: 50px; height: 50px; background: var(--primary); color: white; border: none; border-radius: 50%; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        .round-btn.active { background: #fff; color: var(--primary); }

        /* --- STUDIO TOOLBAR (Gọn gàng bên trái) --- */
        #ai-toolbar { position: absolute; top: 200px; left: 15px; width: 60px; z-index: 9998; background: var(--glass); padding: 10px 5px; border-radius: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        #ai-toolbar.hidden { transform: translateX(-150%); opacity: 0; }
        .side-label { font-size: 10px; font-weight: bold; color: var(--dark); text-align: center; line-height: 1; }

        #ui-canvas { position: absolute; inset: 0; z-index: 100; pointer-events: auto; }
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="loading"><p>ĐANG TÁCH NỀN...</p></div>

<div id="intro-overlay">
    <video id="v-intro" autoplay muted loop playsinline><source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4"></video>
    <div class="start-btn" onclick="killIntro()">MỜI BẠN BẮT ĐẦU THAM QUAN</div>
</div>

<div class="ui-sidebar">
    <button class="round-btn active" id="btn-vr" onclick="switchTab('vr')">🏠</button>
    <button class="round-btn" style="background:#27ae60" onclick="switchTab('shop')">🛒</button>
    <button class="round-btn" onclick="toggleAI()">📸</button>
</div>

<div id="ai-toolbar" class="hidden">
    <label for="input-file" style="cursor: pointer; text-align: center;">
        <div class="round-btn" style="width:40px; height:40px; font-size:16px;">➕</div>
        <div class="side-label">TẢI ẢNH</div>
    </label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="initAI(this)">
    
    <div id="edit-controls" style="display: none; flex-direction: column; gap: 15px; align-items: center;">
        <div style="transform: rotate(-90deg); width: 100px; height: 40px; margin: 40px 0;">
            <input type="range" id="size-slider" min="0.2" max="2.0" step="0.01" value="1.0" oninput="render()" style="width: 100%;">
        </div>
        <div class="round-btn" onclick="startCapture()" style="width:40px; height:40px; background:var(--success)">💾</div>
    </div>
</div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<canvas id="ui-canvas"></canvas>

<script>
    const API_KEY = "FtyKLHXkG5By3gFBCBcoTACC";
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let offset = { x: 0, y: 0 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        render();
    }
    window.onresize = resize;
    resize();

    function killIntro() {
        const intro = document.getElementById('intro-overlay');
        if (intro) { intro.style.opacity = '0'; setTimeout(() => intro.remove(), 500); }
    }

    function switchTab(tab) {
        killIntro();
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.getElementById('ai-toolbar').classList.add('hidden');
    }

    function toggleAI() {
        killIntro();
        document.getElementById('ai-toolbar').classList.toggle('hidden');
    }

    async function initAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";
        const formData = new FormData();
        formData.append("image_file", input.files[0]);
        try {
            const res = await fetch("https://api.remove.bg/v1.0/removebg", { method: "POST", headers: { "X-Api-Key": API_KEY }, body: formData });
            const blob = await res.blob();
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = (canvas.height - imgPos.h) / 2;
                document.getElementById('loading').style.display = "none";
                document.getElementById('edit-controls').style.display = "flex";
                render();
            };
            img.src = URL.createObjectURL(blob);
        } catch (e) { document.getElementById('loading').style.display = "none"; }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (userImg) {
            const s = document.getElementById('size-slider').value;
            ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
        }
    }

    // --- LOGIC DI CHUYỂN ẢNH BẰNG TAY (TOUCH) ---
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', (e) => drag(e.touches[0]));
    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('touchend', stopDrag);

    function startDrag(e) {
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        if (e.clientX >= imgPos.x && e.clientX <= imgPos.x + imgPos.w * s &&
            e.clientY >= imgPos.y && e.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            offset.x = e.clientX - imgPos.x;
            offset.y = e.clientY - imgPos.y;
        }
    }
    function drag(e) { if (isDragging) { imgPos.x = e.clientX - offset.x; imgPos.y = e.clientY - offset.y; render(); } }
    function stopDrag() { isDragging = false; }

    function startCapture() {
        document.querySelector('.ui-sidebar').style.display = 'none';
        document.getElementById('ai-toolbar').style.display = 'none';
        setTimeout(() => {
            html2canvas(document.body).then(c => {
                const a = document.createElement('a');
                a.download = 'checkin.png'; a.href = c.toDataURL(); a.click();
                document.querySelector('.ui-sidebar').style.display = 'flex';
                document.getElementById('ai-toolbar').style.display = 'flex';
            });
        }, 500);
    }
</script>
</body>
</html>
