<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI Studio - Fix Interaction</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --success: #2ecc71; --glass: rgba(255, 255, 255, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        
        /* TẦNG 1: IFRAME TOUR (Dưới cùng) */
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1; }
        .pano-page.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }

        /* TẦNG 2: CANVAS (Ở giữa - Để di chuyển người) */
        #ui-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 50; /* Cao hơn Iframe */
            cursor: move; 
            touch-action: none; /* Quan trọng: Chặn cuộn trang khi kéo người */
        }

        /* TẦNG 3: GIAO DIỆN NÚT BẤM (Trên cùng - Để không bị đơ) */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; /* Cao nhất */
            pointer-events: none; /* Cho phép bấm xuyên qua vùng trống */
        }
        
        /* Bật lại cảm ứng cho các nút bấm bên trong ui-layer */
        .pointer-on { pointer-events: auto; }

        .top-btns { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; }
        .round-btn { 
            width: 50px; height: 50px; background: var(--primary); color: white; 
            border: none; border-radius: 50%; cursor: pointer; font-weight: bold; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }

        .controls { 
            position: absolute; top: 80px; left: 15px; width: 280px; 
            background: var(--glass); padding: 15px; border-radius: 15px; 
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .controls.show { display: block; }

        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 20000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .loader { width: 40px; height: 40px; border: 4px solid #fff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .btn-action { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
        input[type=range] { width: 100%; accent-color: var(--primary); margin: 15px 0; }
    </style>
</head>
<body>

<div id="loading"><div class="loader"></div><p id="load-text">Đang xử lý ảnh...</p></div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<canvas id="ui-canvas"></canvas>

<div class="ui-layer">
    <div class="top-btns pointer-on">
        <button class="round-btn" onclick="switchTab('vr')">VR</button>
        <button class="round-btn" onclick="switchTab('shop')">SHOP</button>
        <button class="round-btn" onclick="toggleAI()">AI</button>
    </div>

    <div class="controls pointer-on" id="ai-menu">
        <h3 style="margin:0 0 10px 0; text-align:center;">STUDIO AI</h3>
        <label for="input-file" class="btn-action" style="text-align:center">📸 Chọn ảnh người</label>
        <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="processAI(this)">
        
        <div id="edit-area" style="display: none;">
            <p style="font-size:12px; margin-top:10px">Kích thước:</p>
            <input type="range" id="size-slider" min="0.1" max="2.5" step="0.01" value="0.8" oninput="draw()">
            <p style="font-size:11px; color:#555; text-align:center">💡 Mẹo: Dùng ngón tay kéo người để di chuyển</p>
            <button class="btn-action" style="background: var(--success);" onclick="save()">💾 Lưu bưu thiếp</button>
        </div>
    </div>
</div>

<script>
    // --- CẤU HÌNH ---
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";

    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    // Thiết lập kích thước Canvas full màn hình
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('show'); }

    // --- XỬ LÝ ẢNH VỚI CLOUDINARY ---
    async function processAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('load-text').innerText = "Đang tách nền AI...";

        const formData = new FormData();
        formData.append('file', input.files[0]);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            const img = new Image();
            img.crossOrigin = "anonymous"; // Quan trọng để vẽ lên canvas
            img.onload = () => {
                userImg = img;
                // Tính toán vị trí ban đầu
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5; // Cao bằng 50% màn hình
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                
                document.getElementById('edit-area').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                draw();
            };
            // Gọi lệnh tách nền của Cloudinary
            img.src = data.secure_url.replace('/upload/', '/upload/e_background_removal/');
        } catch (err) {
            alert("Lỗi kết nối. Vui lòng thử lại!");
            document.getElementById('loading').style.display = 'none';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const scale = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * scale, imgPos.h * scale);
    }

    // --- LOGIC KÉO THẢ (DRAG & DROP) ---
    function handleStart(e) {
        const pos = e.touches ? e.touches[0] : e;
        const scale = document.getElementById('size-slider').value;
        // Kiểm tra xem có chạm trúng người không
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * scale &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * scale) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
        }
    }

    function handleMove(e) {
        if (!isDragging) return;
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
    }

    function handleEnd() { isDragging = false; }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // --- LƯU ẢNH ---
    function save() {
        // Ẩn giao diện đi để chụp ảnh
        document.querySelector('.ui-layer').style.display = 'none';
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('load-text').innerText = "Đang tạo bưu thiếp...";
        
        setTimeout(() => {
            html2canvas(document.body, { 
                useCORS: true, 
                backgroundColor: null 
            }).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-tour.png';
                a.href = c.toDataURL();
                a.click();
                
                // Hiện lại giao diện sau khi chụp xong
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.ui-layer').style.display = 'block';
            });
        }, 500);
    }

    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };
</script>
</body>
</html>
