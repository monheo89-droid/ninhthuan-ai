<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Studio Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #FF6B00; --glass: rgba(20, 20, 20, 0.9); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; -webkit-touch-callout: none; }

        /* VIEWPORT */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        .iframe-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .iframe-layer.active { z-index: 5; opacity: 1; pointer-events: auto; }
        #studio-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; touch-action: none; }

        /* THANH CÔNG CỤ (DOCK) */
        .right-dock {
            position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
            z-index: 9000; display: flex; flex-direction: column; gap: 12px; align-items: center;
            background: var(--glass); backdrop-filter: blur(10px); padding: 15px 8px; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); transition: opacity 0.3s;
        }

        .tool-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #ccc; font-size: 16px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .tool-btn:active { transform: scale(0.9); }
        .tool-btn.btn-cam { background: transparent; border: 2px solid white; color: white; }
        
        /* CHUYỂN CHẾ ĐỘ (SWITCHER) */
        .mode-switcher { display: flex; flex-direction: column; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 25px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .mode-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: #666; font-size: 14px; cursor: pointer; transition: 0.3s; }
        
        /* Trạng thái Active rõ ràng */
        .mode-btn.active { background: var(--primary); color: #fff; box-shadow: 0 0 8px var(--primary); }

        /* SLIDER */
        .slider-container { height: 120px; width: 40px; display: flex; justify-content: center; padding: 5px 0; }
        input[type=range] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 6px; height: 100%; background: rgba(255,255,255,0.3); border-radius: 3px; outline: none; }

        /* TOP NAV */
        .top-bar { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 10px; }
        .nav-btn { background: rgba(255,255,255,0.2); color: #ddd; padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; }
        .nav-btn.active { background: #fff; color: #000; }

        /* MASK & LOADING */
        #postcard-mask { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0; height: 0; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 1); z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.5s; border: 2px dashed rgba(255,255,255,0.5); }
        #postcard-mask.active { opacity: 1; width: 45vh; height: 56.25vh; }
        
        body.capture-mode .top-bar, body.capture-mode .right-dock { opacity: 0; pointer-events: none; }

        #loader, #count-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; background: rgba(0,0,0,0.9); }
        #count-layer { font-size: 100px; font-weight: 900; background: transparent; pointer-events: none; text-shadow: 0 0 20px black; }
        .spinner { width: 30px; height: 30px; border: 3px solid #555; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Toast thông báo */
        .toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; z-index: 11000; display: none; pointer-events: none; }
    </style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p style="margin-top:10px; font-size:12px">ĐANG XỬ LÝ...</p></div>
<div id="count-layer">3</div>
<div id="toast-msg" class="toast">Đã chuyển sang chế độ Nền</div>

<div id="postcard-mask"></div>

<div class="top-bar">
    <button class="nav-btn active" id="btn-vr" onclick="App.switch('vr')">VR Tour</button>
    <button class="nav-btn" id="btn-shop" onclick="App.switch('shop')">Gian Hàng</button>
</div>

<div class="right-dock">
    <div class="mode-switcher">
        <button class="mode-btn active" id="mode-person" onclick="Studio.setTarget('person')" title="Chỉnh Nhân Vật">
            <i class="fas fa-user"></i>
        </button>
        <button class="mode-btn" id="mode-bg" onclick="Studio.setTarget('bg')" title="Chỉnh Nền/Sticker">
            <i class="far fa-image"></i>
        </button>
    </div>

    <button class="tool-btn" onclick="Studio.addFileClick()">
        <i class="fas fa-plus"></i>
    </button>
    
    <input type="file" id="inp-person" hidden accept="image/*" onchange="Studio.handlePerson(this)">
    <input type="file" id="inp-bg" hidden accept="image/*" onchange="Studio.handleBg(this)">

    <div class="slider-container">
        <input type="range" id="scale-slider" min="0.1" max="3.0" step="0.05" value="1.0" oninput="Studio.setScale(this.value)">
    </div>

    <button class="tool-btn" onclick="Studio.flip()">
        <i class="fas fa-exchange-alt"></i>
    </button>

    <button class="tool-btn btn-cam" onclick="App.capture()">
        <i class="fas fa-camera"></i>
    </button>
</div>

<div class="viewport">
    <iframe id="frame-vr" class="iframe-layer active" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="iframe-layer" src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="studio-canvas"></canvas>

<div id="intro-layer" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:20000;display:flex;align-items:center;justify-content:center;">
    <video id="v-intro" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;">
        <source src="https://monheo89-droid.github.io/ninhthuan-ai/video/intro.mp4" type="video/mp4">
    </video>
    <button onclick="document.getElementById('intro-layer').remove()" style="position:absolute;bottom:50px;padding:12px 30px;border-radius:30px;border:1px solid white;background:rgba(0,0,0,0.6);color:white;cursor:pointer;font-weight:bold;">BẮT ĐẦU</button>
</div>

<script>
const CONFIG = { API_KEY: "FtyKLHXkG5By3gFBCBcoTACC" };

const App = {
    switch: (t) => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        document.querySelectorAll('.iframe-layer').forEach(f => f.classList.remove('active'));
        document.getElementById('frame-'+t).classList.add('active');
    },

    capture: () => {
        const c = document.getElementById('count-layer');
        const m = document.getElementById('postcard-mask');
        let n = 3; c.style.display='flex'; c.innerText=n;
        const t = setInterval(()=>{
            n--; if(n>0) c.innerText=n;
            else {
                clearInterval(t); c.style.display='none';
                document.body.classList.add('capture-mode');
                m.classList.add('active');
                setTimeout(()=>{
                    document.body.classList.remove('capture-mode');
                    m.classList.remove('active');
                }, 6000);
            }
        },1000);
    },

    toast: (msg) => {
        const t = document.getElementById('toast-msg');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(()=>t.style.display='none', 2000);
    }
};

const Studio = {
    canvas: document.getElementById('studio-canvas'),
    ctx: document.getElementById('studio-canvas').getContext('2d'),
    
    // Mặc định chọn Người
    target: 'person', 
    
    // Dữ liệu riêng biệt
    person: { img:null, x:0, y:0, s:1, f:false },
    bg:     { img:null, x:0, y:0, s:1, f:false },

    init: function() {
        this.resize();
        window.onresize = () => { this.resize(); this.draw(); };
        ['mousedown','touchstart'].forEach(e => this.canvas.addEventListener(e, this.start.bind(this), {passive:false}));
        ['mousemove','touchmove'].forEach(e => window.addEventListener(e, this.move.bind(this), {passive:false}));
        ['mouseup','touchend'].forEach(e => window.addEventListener(e, () => this.drag=false));
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.draw();
    },

    // --- LOGIC CHUYỂN ĐỔI NGƯỜI / NỀN ---
    setTarget: function(t) {
        this.target = t;
        // Cập nhật giao diện nút bấm
        document.getElementById('mode-person').className = t==='person' ? 'mode-btn active' : 'mode-btn';
        document.getElementById('mode-bg').className = t==='bg' ? 'mode-btn active' : 'mode-btn';
        
        // Cập nhật thanh trượt theo giá trị của đối tượng đang chọn
        const val = t==='person' ? this.person.s : this.bg.s;
        document.getElementById('scale-slider').value = val;
        
        // Thông báo nhỏ
        App.toast(t==='person' ? "Đang chỉnh Nhân Vật" : "Đang chỉnh Ảnh Nền");
    },

    // --- LOGIC THÊM ẢNH THÔNG MINH ---
    addFileClick: function() {
        if(this.target === 'person') {
            document.getElementById('inp-person').click();
        } else {
            // Nếu đang ở chế độ Nền, kích hoạt input nền
            document.getElementById('inp-bg').click();
        }
    },

    // Xử lý upload Người (Có AI)
    handlePerson: async function(inp) {
        if(!inp.files[0]) return;
        document.getElementById('loader').style.display = 'flex';
        const fd = new FormData();
        fd.append("image_file", inp.files[0]);
        try {
            const r = await fetch("https://api.remove.bg/v1.0/removebg", {
                method:"POST", headers:{"X-Api-Key": CONFIG.API_KEY}, body:fd
            });
            if(!r.ok) throw 0;
            this.load(await r.blob(), 'person');
        } catch {
            alert("Lỗi AI. Dùng ảnh gốc.");
            this.load(inp.files[0], 'person');
        }
    },

    // Xử lý upload Nền (Không AI)
    handleBg: function(inp) {
        if(!inp.files[0]) return;
        this.load(inp.files[0], 'bg');
    },

    load: function(src, type) {
        const i = new Image();
        i.onload = () => {
            const obj = type==='person' ? this.person : this.bg;
            obj.img = i;
            
            // Auto fit vị trí
            if(type === 'person') {
                const h = this.canvas.height * 0.5;
                obj.s = h / i.height;
                obj.x = this.canvas.width/2;
                obj.y = this.canvas.height - h/2 - 50;
            } else {
                // Background thì để giữa màn hình
                obj.s = 1;
                obj.x = this.canvas.width/2;
                obj.y = this.canvas.height/2;
            }
            
            // Nếu đang load đúng loại đang chọn thì update slider
            if(this.target === type) {
                document.getElementById('scale-slider').value = obj.s;
            }

            document.getElementById('loader').style.display = 'none';
            this.canvas.style.pointerEvents = 'auto';
            this.draw();
        };
        i.src = URL.createObjectURL(src instanceof Blob ? src : new Blob([src]));
    },

    draw: function() {
        this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
        // Vẽ BG nằm dưới
        this.drawObj(this.bg);
        // Vẽ Người nằm trên
        this.drawObj(this.person);
    },

    drawObj: function(obj) {
        if(!obj.img) return;
        this.ctx.save();
        this.ctx.translate(obj.x, obj.y);
        this.ctx.scale(obj.f?-obj.s:obj.s, obj.s);
        this.ctx.shadowBlur=15; this.ctx.shadowColor="rgba(0,0,0,0.5)";
        this.ctx.drawImage(obj.img, -obj.img.width/2, -obj.img.height/2);
        this.ctx.restore();
    },

    setScale: function(v) { 
        const obj = this.target==='person' ? this.person : this.bg;
        obj.s = parseFloat(v); 
        this.draw(); 
    },
    
    flip: function() { 
        const obj = this.target==='person' ? this.person : this.bg;
        obj.f = !obj.f; 
        this.draw(); 
    },

    drag: false, sx:0, sy:0,
    start: function(e) {
        this.drag=true;
        const p = e.touches?e.touches[0]:e;
        // Kéo thả đúng đối tượng đang chọn
        const obj = this.target==='person' ? this.person : this.bg;
        this.sx = p.clientX - obj.x;
        this.sy = p.clientY - obj.y;
    },
    move: function(e) {
        if(!this.drag) return;
        if(e.cancelable) e.preventDefault();
        const p = e.touches?e.touches[0]:e;
        const obj = this.target==='person' ? this.person : this.bg;
        obj.x = p.clientX - this.sx;
        obj.y = p.clientY - this.sy;
        this.draw();
    }
};

Studio.init();
</script>
</body>
</html>
