<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Postcard Mode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE STYLE --- */
        :root { --primary: #FF6B00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }

        /* 1. LAYOUT LAYER */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .iframe-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
            z-index: 1; opacity: 0; pointer-events: none;
        }
        .iframe-layer.active { z-index: 5; opacity: 1; pointer-events: auto; }

        /* Canvas Nhân vật */
        #studio-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; touch-action: none; }

        /* 2. CINEMA MASK (Lớp Mặt Nạ Bưu Thiếp) */
        #postcard-mask {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 0; height: 0; /* Mặc định ẩn */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.9); /* Che tối xung quanh */
            z-index: 8000; pointer-events: none; opacity: 0; transition: opacity 0.5s;
            border: 5px solid white; /* Viền trắng bưu thiếp */
            border-radius: 4px;
        }
        
        /* Kích thước khung bưu thiếp khi hiện lên */
        #postcard-mask.active {
            opacity: 1;
            /* Tỷ lệ Portrait 4:5 (Hợp mobile & focus trung tâm laptop) */
            width: 50vh; height: 62.5vh; 
        }

        /* Logo/Text trên bưu thiếp */
        .postcard-brand {
            position: absolute; bottom: 10px; right: 10px;
            color: rgba(255,255,255,0.8); font-size: 14px; font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: none;
        }
        #postcard-mask.active .postcard-brand { display: block; }

        /* 3. UI CONTROLS (Sẽ ẩn khi chụp) */
        .ui-element { transition: opacity 0.3s; }
        body.clean-mode .ui-element { opacity: 0; pointer-events: none; }

        /* Dock bên phải */
        .right-dock {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            z-index: 9000; display: flex; flex-direction: column; gap: 15px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            padding: 15px 10px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
        }
        .tool-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: white; font-size: 18px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.3); }
        .tool-btn.main { background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        /* Slider */
        .slider-wrap { width: 45px; height: 100px; display: flex; justify-content: center; padding: 10px 0; }
        input[type=range] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 6px; height: 100%; }

        /* Top Bar */
        .top-bar { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 10px; }
        .nav-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; }
        .nav-btn.active { background: white; color: black; font-weight: bold; }

        /* Countdown */
        #count-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: none; align-items: center; justify-content: center;
            font-size: 120px; font-weight: 900; color: white; text-shadow: 0 0 30px black;
        }

        /* Loading */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            z-index: 10000; display: none; align-items: center; justify-content: center; color: white; flex-direction: column;
        }
    </style>
</head>
<body>

<div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Đang xử lý AI...</p></div>

<div id="count-layer">3</div>

<div id="postcard-mask">
    <div class="postcard-brand">NINH THUẬN TOUR</div>
</div>

<div class="top-bar ui-element">
    <button class="nav-btn active" id="btn-vr" onclick="App.switch('vr')">VR Tour</button>
    <button class="nav-btn" id="btn-shop" onclick="App.switch('shop')">Gian Hàng</button>
</div>

<div class="right-dock ui-element">
    <button class="tool-btn" onclick="document.getElementById('inp-file').click()"><i class="fas fa-user-plus"></i></button>
    <div class="slider-wrap"><input type="range" min="0.5" max="2.5" step="0.1" value="1" oninput="Studio.scale(this.value)"></div>
    <button class="tool-btn" onclick="Studio.flip()"><i class="fas fa-exchange-alt"></i></button>
    <button class="tool-btn main" onclick="App.snap()"><i class="fas fa-camera"></i></button>
</div>

<div class="viewport">
    <iframe id="frame-vr" class="iframe-layer active" src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" allowfullscreen></iframe>
    <iframe id="frame-shop" class="iframe-layer" src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" allowfullscreen></iframe>
</div>

<canvas id="studio-canvas"></canvas>
<input type="file" id="inp-file" hidden accept="image/*" onchange="Studio.handleAI(this)">

<script>
const App = {
    switch: (t) => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        document.querySelectorAll('.iframe-layer').forEach(f => f.classList.remove('active'));
        document.getElementById('frame-'+t).classList.add('active');
    },

    snap: () => {
        const countEl = document.getElementById('count-layer');
        const mask = document.getElementById('postcard-mask');
        let n = 3;
        
        countEl.style.display = 'flex';
        countEl.innerText = n;

        const timer = setInterval(() => {
            n--;
            if(n > 0) {
                countEl.innerText = n;
            } else {
                clearInterval(timer);
                countEl.style.display = 'none';
                
                // 1. Ẩn nút bấm
                document.body.classList.add('clean-mode');
                
                // 2. Hiện KHUNG BƯU THIẾP (Tối xung quanh)
                mask.classList.add('active');

                // 3. Tự động trả về trạng thái cũ sau 5s
                setTimeout(() => {
                    document.body.classList.remove('clean-mode');
                    mask.classList.remove('active');
                }, 5000);
            }
        }, 1000);
    }
};

const Studio = {
    canvas: document.getElementById('studio-canvas'),
    ctx: document.getElementById('studio-canvas').getContext('2d'),
    img: null,
    st: { x:0, y:0, s:1, f:false },

    init: function() {
        this.resize();
        window.onresize = () => { this.resize(); this.draw(); };
        // Events touch/mouse đơn giản hóa
        ['mousedown','touchstart'].forEach(e => this.canvas.addEventListener(e, this.start.bind(this)));
        ['mousemove','touchmove'].forEach(e => window.addEventListener(e, this.move.bind(this), {passive:false}));
        ['mouseup','touchend'].forEach(e => window.addEventListener(e, () => this.drag=false));
    },

    resize: function() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.draw();
    },

    handleAI: async function(inp) {
        if(!inp.files[0]) return;
        document.getElementById('loader').style.display = 'flex';
        const fd = new FormData();
        fd.append("image_file", inp.files[0]);
        try {
            const r = await fetch("https://api.remove.bg/v1.0/removebg", {
                method:"POST", headers:{"X-Api-Key":"FtyKLHXkG5By3gFBCBcoTACC"}, body:fd
            });
            if(!r.ok) throw 0;
            this.load(await r.blob());
        } catch {
            alert("Lỗi AI. Dùng ảnh gốc.");
            this.load(inp.files[0]);
        }
    },

    load: function(src) {
        const i = new Image();
        i.onload = () => {
            this.img = i;
            this.st.s = (this.canvas.height * 0.5) / i.height;
            this.st.x = this.canvas.width/2; 
            this.st.y = this.canvas.height/2 + 100;
            document.querySelector('input[type=range]').value = this.st.s;
            document.getElementById('loader').style.display = 'none';
            this.canvas.style.pointerEvents = 'auto';
            this.draw();
        };
        i.src = URL.createObjectURL(src instanceof Blob ? src : new Blob([src]));
    },

    draw: function() {
        this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
        if(!this.img) return;
        const {x,y,s,f} = this.st;
        this.ctx.save();
        this.ctx.translate(x,y);
        this.ctx.scale(f?-s:s, s);
        this.ctx.shadowBlur=15; this.ctx.shadowColor="rgba(0,0,0,0.5)";
        this.ctx.drawImage(this.img, -this.img.width/2, -this.img.height/2);
        this.ctx.restore();
    },

    scale: function(v) { this.st.s = parseFloat(v); this.draw(); },
    flip: function() { this.st.f = !this.st.f; this.draw(); },

    drag: false, sx:0, sy:0,
    start: function(e) {
        if(!this.img) return;
        this.drag=true;
        const p = e.touches?e.touches[0]:e;
        this.sx = p.clientX - this.st.x;
        this.sy = p.clientY - this.st.y;
    },
    move: function(e) {
        if(!this.drag) return;
        if(e.cancelable) e.preventDefault();
        const p = e.touches?e.touches[0]:e;
        this.st.x = p.clientX - this.sx;
        this.st.y = p.clientY - this.sy;
        this.draw();
    }
};
Studio.init();
</script>
</body>
</html>
