<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninh Thuận AI - Fix Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #ff9800; --success: #27ae60; --glass: rgba(255, 255, 255, 0.9); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; }
        
        /* Cấu trúc Layer để không bị đè nút */
        .pano-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1; }
        .pano-page.active { display: block; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Canvas để vẽ người và di chuyển */
        #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: auto; }

        /* Menu điều khiển */
        .top-btns { position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 10px; }
        .round-btn { width: 50px; height: 50px; background: var(--primary); color: white; border: none; border-radius: 50%; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        .controls { 
            position: absolute; top: 80px; left: 20px; z-index: 90; width: 260px; 
            background: var(--glass); padding: 20px; border-radius: 20px; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .controls.show { display: block; }

        #loading { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 1000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; color: white; 
        }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .btn-main { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; border-radius: 10px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loading"><div class="loader"></div><p id="load-text">Đang tách nền AI...</p></div>

<div class="top-btns">
    <button class="round-btn" onclick="switchTab('vr')">VR</button>
    <button class="round-btn" onclick="switchTab('shop')">SHOP</button>
    <button class="round-btn" onclick="toggleAI()">AI</button>
</div>

<div id="page-vr" class="pano-page active"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c"></iframe></div>
<div id="page-shop" class="pano-page"><iframe src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb"></iframe></div>

<div class="controls" id="ai-menu">
    <h3 style="margin:0 0 10px 0; text-align:center;">NINH THUẬN STUDIO</h3>
    <label for="input-file" class="btn-main" style="text-align:center;">📸 Chọn ảnh người</label>
    <input type="file" id="input-file" accept="image/*" style="display: none;" onchange="handleAI(this)">
    
    <div id="edit-area" style="display: none; margin-top: 15px;">
        <label style="font-size: 12px;">Kích thước:</label>
        <input type="range" id="size-slider" min="0.2" max="2.5" step="0.01" value="1.0" style="width:100%" oninput="render()">
        <p style="font-size: 11px; color: #666; margin-top: 10px;">💡 Mẹo: Chạm giữ người để di chuyển vị trí</p>
        <button class="btn-main" style="background: var(--success);" onclick="takeSnapshot()">💾 Lưu bưu thiếp</button>
    </div>
</div>

<canvas id="ui-canvas"></canvas>

<script>
    // Thông tin Cloudinary của bạn
    const CLOUD_NAME = "dxqbzw5s3";
    const UPLOAD_PRESET = "Khanh_Hoa";

    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    let userImg = null;
    let imgPos = { x: 100, y: 100, w: 0, h: 0 };
    let isDragging = false;
    let offset = { x: 0, y: 0 };

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function switchTab(tab) {
        document.querySelectorAll('.pano-page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('show'); }

    async function handleAI(input) {
        if (!input.files[0]) return;
        document.getElementById('loading').style.display = "flex";

        const formData = new FormData();
        formData.append("file", input.files[0]);
        formData.append("upload_preset", UPLOAD_PRESET);

        try {
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.5;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 50;
                
                document.getElementById('edit-area').style.display = "block";
                document.getElementById('loading').style.display = "none";
                render();
            };
            // Cấu hình tách nền Cloudinary đúng chuẩn
            img.src = data.secure_url.replace('/upload/', '/upload/e_background_removal/');
        } catch (e) {
            alert("Lỗi server AI. Vui lòng thử lại.");
            document.getElementById('loading').style.display = "none";
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    // --- Xử lý di chuyển bằng cảm ứng/chuột ---
    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', (e) => drag(e.touches[0]));
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);

    function startDrag(e) {
        const s = document.getElementById('size-slider').value;
        if (userImg && e.clientX >= imgPos.x && e.clientX <= imgPos.x + imgPos.w * s &&
            e.clientY >= imgPos.y && e.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            offset.x = e.clientX - imgPos.x;
            offset.y = e.clientY - imgPos.y;
        }
    }

    function drag(e) {
        if (isDragging) {
            imgPos.x = e.clientX - offset.x;
            imgPos.y = e.clientY - offset.y;
            render();
        }
    }

    function takeSnapshot() {
        document.getElementById('ai-menu').classList.remove('show');
        document.getElementById('loading').style.display = "flex";
        document.getElementById('load-text').innerText = "Đang tạo bưu thiếp...";
        
        setTimeout(() => {
            html2canvas(document.body, { useCORS: true, allowTaint: false }).then(c => {
                const a = document.createElement('a');
                a.download = 'ninh-thuan-ai.png';
                a.href = c.toDataURL();
                a.click();
                document.getElementById('loading').style.display = "none";
            });
        }, 500);
    }
</script>
</body>
</html>
