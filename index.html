<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ninh Thuận Tour</title>
    
    <style>
        /* --- CẤU HÌNH CƠ BẢN --- */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; /* Bỏ màu xanh khi ấn nút trên Android */
        }

        /* --- THANH MENU ĐIỀU HƯỚNG --- */
        .top-bar {
            position: absolute; 
            /* Tự động né vùng tai thỏ/camera */
            top: calc(20px + env(safe-area-inset-top)); 
            left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 8px;
            background: rgba(20, 20, 20, 0.85); /* Màu tối sang trọng hơn */
            padding: 6px; border-radius: 50px;
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn {
            background: transparent; border: none; color: #aaa;
            padding: 10px 24px; border-radius: 40px; 
            font-weight: 600; font-size: 14px;
            cursor: pointer; transition: all 0.25s ease;
            white-space: nowrap;
        }

        /* Hiệu ứng khi chọn active */
        .nav-btn.active {
            background: #fff; color: #000; 
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }
        
        .nav-btn:active { transform: scale(0.95); } /* Hiệu ứng nhấn xuống */

        /* --- KHUNG HIỂN THỊ --- */
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; }

        .iframe-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
            z-index: 1; opacity: 0; visibility: hidden; transition: opacity 0.4s;
            will-change: opacity; /* Tăng tốc phần cứng */
        }
        .iframe-layer.active { z-index: 5; opacity: 1; visibility: visible; }

        /* --- LOADER --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50; display: flex;
            align-items: center; justify-content: center; color: rgba(255,255,255,0.7);
            flex-direction: column; font-size: 10px; letter-spacing: 2px;
        }
        .spinner {
            width: 24px; height: 24px; border: 2px solid #333; 
            border-top: 2px solid #FF6B00; border-radius: 50%; 
            animation: spin 0.6s infinite linear; margin-bottom: 12px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>LOADING
    </div>

    <div class="top-bar">
        <button class="nav-btn active" id="btn-vr" onclick="switchTab('vr')">VR TOUR</button>
        <button class="nav-btn" id="btn-shop" onclick="switchTab('shop')">GIAN HÀNG</button>
    </div>

    <div class="viewport">
        <iframe id="frame-vr" class="iframe-layer" 
            data-src="https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c" 
            allowfullscreen></iframe>

        <iframe id="frame-shop" class="iframe-layer" 
            data-src="https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb" 
            allowfullscreen></iframe>
    </div>

    <script>
        const TABS = ['vr', 'shop'];

        function switchTab(targetId) {
            // Rung nhẹ điện thoại khi bấm (nếu hỗ trợ) tạo cảm giác thật
            if(navigator.vibrate) navigator.vibrate(10);

            TABS.forEach(t => {
                document.getElementById('btn-' + t).classList.remove('active');
                document.getElementById('frame-' + t).classList.remove('active');
            });

            document.getElementById('btn-' + targetId).classList.add('active');
            const targetFrame = document.getElementById('frame-' + targetId);
            targetFrame.classList.add('active');

            // Lazy Load thông minh
            if (!targetFrame.src || targetFrame.src === "") {
                const loader = document.getElementById('loader');
                loader.style.display = 'flex';
                targetFrame.src = targetFrame.getAttribute('data-src');
                targetFrame.onload = () => { loader.style.display = 'none'; };
            }
        }

        window.onload = () => {
            switchTab('vr');
            setTimeout(() => {
                const loader = document.getElementById('loader');
                if(loader) loader.style.display = 'none';
            }, 800);
        };
    </script>
</body>
</html>
