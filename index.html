<script>
    // --- PWA INSTALLATION LOGIC ---
    let deferredPrompt;
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker OK'))
                .catch(err => console.log('SW Fail', err));
        });
    }
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block';
    });
    async function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        }
    }

    // --- APP LOGIC CHÍNH ---
    const canvas = document.getElementById('ui-canvas');
    const ctx = canvas.getContext('2d');
    const vrFrame = document.getElementById('vr-frame');
    let userImg = null;
    let imgPos = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let startX, startY;

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function closeIntro() {
        const intro = document.getElementById('intro-overlay');
        document.getElementById('v-intro').pause();
        intro.style.opacity = '0';
        setTimeout(() => intro.remove(), 500);
    }

    function switchTab(tab) {
        if(tab === 'vr') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/68c2e05f65c1d76691a79f7c";
        if(tab === 'shop') vrFrame.src = "https://tour.panoee.net/68972f4ba3c49352552578cd/691b32dc061521c90def58cb";
    }

    function toggleAI() { document.getElementById('ai-menu').classList.toggle('show'); }

    // --- HÀM MỚI: NÉN ẢNH TRƯỚC KHI XỬ LÝ (QUAN TRỌNG) ---
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const elem = document.createElement('canvas');
                    const maxWidth = 1000; // Giới hạn 1000px là đủ đẹp và nhẹ
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                    elem.width = width;
                    elem.height = height;
                    const ctx = elem.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Xuất ra file ảnh nhẹ hơn
                    elem.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/jpeg', 0.8);
                };
            };
        });
    }

    // --- XỬ LÝ AI ---
    async function processLocalAI(input) {
        if (!input.files[0]) return;
        
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';

        try {
            // BƯỚC 1: Nén ảnh cho nhẹ bớt
            const compressedFile = await compressImage(input.files[0]);

            // BƯỚC 2: Đưa ảnh nhẹ vào AI xử lý
            const blob = await imglyRemoveBackground(compressedFile, {
                publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal-data@1.0.3/dist/'
            });

            // BƯỚC 3: Hiển thị kết quả
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                userImg = img;
                const ratio = img.width / img.height;
                imgPos.h = canvas.height * 0.6;
                imgPos.w = imgPos.h * ratio;
                imgPos.x = (canvas.width - imgPos.w) / 2;
                imgPos.y = canvas.height - imgPos.h - 20;
                
                loading.style.display = 'none';
                document.getElementById('edit-area').style.display = 'block';
                canvas.classList.add('canvas-active');
                draw();
            };
            img.src = url;

        } catch (error) {
            console.error(error);
            alert("Máy không đủ bộ nhớ để xử lý ảnh này. Hãy thử ảnh nhẹ hơn!");
            loading.style.display = 'none';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!userImg) return;
        const s = document.getElementById('size-slider').value;
        ctx.drawImage(userImg, imgPos.x, imgPos.y, imgPos.w * s, imgPos.h * s);
    }

    function hideMode() {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('toast').style.display = 'block';
        setTimeout(() => { document.getElementById('toast').style.display = 'none'; }, 3000);
        setTimeout(() => { document.getElementById('main-ui').style.display = 'block'; }, 8000);
    }

    function handleStart(e) {
        if (!userImg) return;
        const pos = e.touches ? e.touches[0] : e;
        const s = document.getElementById('size-slider').value;
        if (pos.clientX >= imgPos.x && pos.clientX <= imgPos.x + imgPos.w * s &&
            pos.clientY >= imgPos.y && pos.clientY <= imgPos.y + imgPos.h * s) {
            isDragging = true;
            startX = pos.clientX - imgPos.x;
            startY = pos.clientY - imgPos.y;
        }
    }
    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const pos = e.touches ? e.touches[0] : e;
        imgPos.x = pos.clientX - startX;
        imgPos.y = pos.clientY - startY;
        draw();
    }
    
    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('touchend', () => isDragging = false);
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); };
</script>
